# foundry-console CI: a thin caller of the platform's reusable build workflow
# (ADR-019). The build logic lives once in foundryRB/rb-ci; this
# only points at it, so it cannot drift. Runs on GitHub-hosted runners: it
# derives a SemVer from Conventional Commits (ADR-024) and pushes the app image
# (devops/Dockerfile via devops/docker-compose.yml), the Helm chart (k8s/), and the
# docs site (docs/Dockerfile) to GHCR. Build-and-push only; no deploy (promotion is
# ADR-022).
#
# Only the app name and the runner are set; every other value matches the reusable
# workflow's defaults, derived from `foundry-console` -- image `foundry-console`, docs
# base `/apps/foundry-console` (the portal mounts it there). The runner is
# GitHub-hosted because this install runs no in-cluster ARC runners.
name: build

on:
  push:
    branches: [main]

jobs:
  build:
    uses: foundryRB/rb-ci/.github/workflows/build.yml@main
    with:
      app-name: foundry-console
      runner: ubuntu-latest
    permissions:
      contents: write
      packages: write
    secrets: inherit
