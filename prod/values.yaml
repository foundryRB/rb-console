# Per-install values. Keys here are THIS install's own facts, pinned
# explicitly: the app chart's defaults belong to whichever install it was
# authored against, and an omitted key inherits them silently.
# auth.oidc is pinned to this install's own realm: the console only admits people
# through its sign-in proxy (the foundry-console realm, granted in teams/foundry-console).
foundry-console:
  githubOwner: foundryrb
  host: foundry-console.rb-foundry.com
  auth:
    oidc:
      enabled: true
      issuer: https://keycloak.rb-foundry.com/realms/foundry-console
      clientId: foundry-console
      existingSecret: keycloak-foundry-console
  config:
    FC_ORG: foundryRB
    FC_WORKER_IMAGE: ghcr.io/foundryrb/foundry-console-worker:1.0.0
  images:
    app:
      tag: 1.0.0
    web:
      tag: 1.0.0
    worker:
      tag: 1.0.0
    docs:
      tag: 1.0.0
