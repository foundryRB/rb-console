foundry-console:
  githubOwner: foundryrb
  host: foundry-console.rb-foundry.com
  auth:
    oidc:
      enabled: true
      issuer: https://keycloak.rb-foundry.com/realms/foundry-console
      clientId: foundry-console
      existingSecret: keycloak-foundry-console
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1536Mi
  config:
    FC_ORG: foundryRB
    FC_DRIVE_LIVE: "1"
    FC_DOMAIN: rb-foundry.com
    FC_WORKER_IMAGE: ghcr.io/foundryrb/foundry-console-worker:1.0.7
    GOGC: "off"
  images:
    app:
      tag: 1.0.8
      repository: ghcr.io/foundryrb/foundry-console-app
    web:
      tag: 1.0.7
      repository: ghcr.io/foundryrb/foundry-console-web
    worker:
      tag: 1.0.7
    docs:
      tag: 1.0.7
      repository: ghcr.io/foundryrb/foundry-console-docs
argo-workflows:
  crds:
    install: false
  singleNamespace: true
  createAggregateRoles: false
  controller:
    workflowNamespaces:
    - foundry-console
  server:
    enabled: false
  workflow:
    rbac:
      create: false
