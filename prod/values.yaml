foundry-console:
  githubOwner: foundryrb
  host: foundry-console.rb-foundry.com
  auth:
    oidc:
      enabled: true
      issuer: https://keycloak.rb-foundry.com/realms/foundry-console
      clientId: foundry-console
      existingSecret: keycloak-foundry-console
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1536Mi
  config:
    FC_ORG: foundryRB
    # The install zone: the console reaches each studio with Host <studio>.<zone> (the
    # studio MCP host guard expects the public hostname); unset, that Host is empty.
    FC_DOMAIN: rb-foundry.com
    FC_WORKER_IMAGE: ghcr.io/foundryrb/foundry-console-worker:1.0.0
    # kubectl (v1.37) crashes at random in its garbage collector on this node (5 of 25
    # runs failed; 0 of 40 with GC off). It is short-lived, so GC off costs nothing.
    GOGC: "off"
  images:
    app:
      tag: 1.0.4
      repository: ghcr.io/foundryrb/foundry-console-app
    web:
      tag: 1.0.4
      repository: ghcr.io/foundryrb/foundry-console-web
    worker:
      tag: 1.0.0
    docs:
      tag: 1.0.4
      repository: ghcr.io/foundryrb/foundry-console-docs
