# Foundry Console intent claims (CSD-INTENT-01). Canonical root spec for the repo.
# The orchestrator core is a deterministic state resolver: it derives a delivery's
# phase and gates from the committed .delivery/ scratch, and it never writes.
# Resolver (Rnn) claims are attested by pytest markers under tests/.
# Audit with: csd-intent .

INT-FC-R01:
  version: 1.1.0
  status: active
  statement: "A repository with no live scratch - no delivery/* ref for the remote source, no .delivery/ mount for the local one - MUST resolve to 'not-a-delivery'."
  rationale: "The set of deliveries is the set of repos carrying a live delivery/* scratch ref (mounted at .delivery/ in a working checkout); a bare repo is not one."
  test:
    scope: unit
    component: StateResolver
    type: behavior
  criticality: high

INT-FC-R02:
  version: 1.0.0
  status: active
  statement: "A .delivery/ with no records MUST resolve to the scope phase, next = deliver-engagement."
  rationale: "A registered but unscoped repo's next step is scope; the resolver must say so, not stall."
  test:
    scope: unit
    component: StateResolver
    type: behavior
  criticality: high

INT-FC-R03:
  version: 1.0.0
  status: active
  statement: "A phase whose record exists with a signed gate MUST advance to the next phase."
  rationale: "A signed gate is the only thing that unblocks the next phase of the line."
  test:
    scope: unit
    component: StateResolver
    type: behavior
  criticality: critical

INT-FC-R04:
  version: 1.0.0
  status: active
  statement: "A phase whose record exists with a PENDING gate MUST suspend at that gate, blocking the next phase."
  rationale: "The gate is the moat: no phase starts until a human signs the one before it."
  test:
    scope: unit
    component: StateResolver
    type: behavior
  criticality: critical

INT-FC-R05:
  version: 1.0.0
  status: active
  statement: "All four records present and signed MUST resolve to 'delivered', next = reconcile-delivery."
  rationale: "A fully-gated delivery's remaining step is the learn phase; the resolver must route there."
  test:
    scope: unit
    component: StateResolver
    type: behavior
  criticality: high

INT-FC-R06:
  version: 1.0.0
  status: active
  statement: "The current phase MUST be derivable from the committed records alone, so a cancelled run resumes."
  rationale: "There is no status field; progress is derived GitOps-style from which records exist."
  test:
    scope: unit
    component: StateResolver
    type: behavior
  criticality: critical

INT-FC-R07:
  version: 1.0.0
  status: active
  statement: "State derivation MUST be read-only: it writes and mutates no delivery artifact."
  rationale: "Principle 4: the Console owns nothing; every write is an owner's, never the resolver's."
  test:
    scope: unit
    component: StateResolver
    type: behavior
  criticality: critical

INT-FC-R08:
  version: 1.0.0
  status: active
  statement: "A gate is read as signed only by a dated stamp; a PENDING stamp MUST never read as signed."
  rationale: "A documented or templated gate line must not be mistaken for a real signature."
  test:
    scope: unit
    component: StateResolver
    type: behavior
  criticality: critical

INT-FC-R09:
  version: 1.0.0
  status: active
  statement: "build_worker_launch MUST name the skill, the repo, the run credential, and the phase's MCP endpoints (playbook-studio plus the phase tool)."
  rationale: "The launch plan is what the orchestrator hands a worker; a missing endpoint or credential is a broken spawn."
  test:
    scope: unit
    component: WorkerLaunch
    type: behavior
  criticality: high

INT-FC-R10:
  version: 1.0.0
  status: active
  statement: "start MUST refuse when the run config is incomplete, before any repo is created."
  rationale: "The orchestrator guarantees the credential and repo rights are present before spawning; no config, no run."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: critical

INT-FC-R11:
  version: 1.1.0
  status: active
  statement: "start on a new target MUST register the repo (mint its delivery/<line-id> scratch ref carrying the skeleton) and then plan the scope launch."
  rationale: "Greenfield and adopt both provision the empty vessel, then launch scope; that is the create-vs-adopt branch."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R12:
  version: 1.0.0
  status: active
  statement: "plan_next MUST suspend at a pending gate (await-gate) instead of planning a launch."
  rationale: "The gate is the moat; the orchestrator never launches the next phase past an unsigned gate."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: critical

INT-FC-R13:
  version: 1.0.0
  status: active
  statement: "The REST door MUST mirror the core: health ok, an incomplete-config start refused with 422, and a complete-config start planning a scope launch."
  rationale: "The door is a thin adapter; it must expose the use cases faithfully, adding no logic and dropping none."
  test:
    scope: integration
    component: RestDoor
    type: behavior
  criticality: high

INT-FC-R15:
  version: 1.0.0
  status: active
  statement: "The worker runner MUST build the spawn invocation deterministically from the launch plan, and MUST NOT spawn a live worker without an explicit opt-in (FC_DRIVE_LIVE) and a credential."
  rationale: "Building the invocation is code; spawning is the model step. A run must never fire by accident or without a credential."
  test:
    scope: unit
    component: WorkerRunner
    type: behavior
  criticality: critical

INT-FC-R16:
  version: 1.0.0
  status: active
  statement: "advance MUST execute a planned launch through the runner and attach the run handle; without opt-in the handle is a dry-run."
  rationale: "advance is the drive step: it plans then executes, but stays guarded so an unattended call cannot fire a live worker unasked."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R17:
  version: 1.1.0
  status: active
  statement: "Delivery workflows MUST start a downstream phase only after the preceding worker succeeds and every intervening gate is released; worker validation failures MUST NOT advance the line."
  rationale: "Process completion and validated work authorize progression. R24 separates a reached human gate from a released gate."
  test:
    scope: integration
    component: DeliveryWorkflow
    type: behavior
  criticality: critical

INT-FC-R18:
  version: 1.3.0
  status: active
  statement: "Interactive workflows MUST suspend at human gates. One-shot MUST insert no human suspend steps and MUST close an engine-authorized gate only over a passing committed fresh-eyes review; missing or failing review MUST fail the attempt."
  rationale: "R24 and R52 establish mode-specific suspensions and canonical review-backed stamping under REF-Delivery. REF-Delivery section 1 compiles one-shot gates to no suspend steps, and REF-Autonomy section 3 grants human gates before the run, never inside it; a gate the engine cannot close ends its step on a terminal stop (R181, #181)."
  test:
    scope: integration
    component: DeliveryGateExecution
    type: behavior
  criticality: critical

INT-FC-R19:
  version: 1.1.0
  status: active
  statement: "Transient process failures, timeouts and incomplete or invalid records MUST retry within the configured executor budget, then stop. Aborted records and deliberate missing-record blockers MUST park terminally without retries; terminal stops MUST NOT advance."
  rationale: "R25 bounds executor retries; R50 gives deliberate blockers a terminal degraded stop instead of repeating work that cannot clear them."
  test:
    scope: integration
    component: DeliveryWorkerRetries
    type: behavior
  criticality: high

INT-FC-R20:
  version: 1.1.0
  status: active
  statement: "Worker validation and record resolution MUST fail closed on missing or empty records, absent or malformed leading YAML, and unsupported statuses; such evidence MUST NOT establish phase completion."
  rationale: "R50 requires work-truth validation. The canonical leading YAML reader establishes record truth for both observation and worker execution."
  test:
    scope: integration
    component: DeliveryRecordValidation
    type: behavior
  criticality: critical

INT-FC-R21:
  version: 1.1.0
  status: active
  statement: "An unsigned interactive gate MUST remain awaiting operator signature even after a passing review. One-shot engine-authorized gates MUST obtain the canonical review-backed signature; a foreign-home delivery gate MUST remain unsigned until the home merge is authorized."
  rationale: "R52 and R103 reserve signatures for the canonical stamper over fresh review evidence. REF-Delivery makes a foreign home merge its delivery gate."
  test:
    scope: integration
    component: DeliveryGateAuthority
    type: behavior
  criticality: high

INT-FC-R22:
  version: 1.0.0
  status: active
  statement: "Frontmatter parsing MUST read a flat leading block and MUST yield None when a record has none, so skills adopt the standard incrementally."
  rationale: "The reader never depends on the skills having been upgraded; a record without frontmatter falls back to the gate-line heuristic."
  test:
    scope: unit
    component: Frontmatter
    type: behavior
  criticality: medium

INT-FC-R23:
  version: 1.0.0
  status: active
  statement: "compile_workflow MUST emit one worker step per remaining phase, in line order, from the delivery's current phase to the end."
  rationale: "The orchestrator compiles the whole remaining line into one Argo Workflow; a missing or misordered step is a broken drive."
  test:
    scope: unit
    component: WorkflowCompiler
    type: behavior
  criticality: high

INT-FC-R24:
  version: 1.2.0
  status: active
  statement: "In interactive mode compile_workflow MUST insert a suspend step after each gated phase; in one-shot mode it MUST insert none."
  rationale: "A gate is a human suspend point in interactive runs; one-shot closes its own gates under the operator's standing pre-authorization (REF-Delivery section 1, REF-Autonomy section 3), so a workflow that suspends for a human it does not have would deadlock. A gate the engine cannot close parks the run through a terminal exit (R181, #181), with no suspend step behind it."
  test:
    scope: unit
    component: WorkflowCompiler
    type: behavior
  criticality: critical

INT-FC-R25:
  version: 1.0.0
  status: active
  statement: "Every worker template MUST carry a bounded retryStrategy and an activeDeadlineSeconds, and MUST reference the run credential by Secret ref, never inline its value."
  rationale: "Argo owns retries and timeouts; the credential is a per-run Secret cited by ref, so the manifest never carries the secret value."
  test:
    scope: unit
    component: WorkflowCompiler
    type: behavior
  criticality: critical

INT-FC-R26:
  version: 1.0.0
  status: active
  statement: "drive MUST persist the worker credential in the credential store keyed by the delivery slug, and the compiled workflow MUST reference it by ref only, never inline the value."
  rationale: "The secret lives in the credential store (a namespace Secret by slug, so the delivery remembers it); only the ref travels into the manifest and git, so the value is never committed or embedded."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: critical

INT-FC-R27:
  version: 1.0.1
  status: active
  statement: "The driver config MUST round-trip base_url and model through the store and report whether a key is set, and MUST never return the api_key value."
  rationale: "The driver is a Claude credential or any Anthropic-compatible endpoint, editable at runtime; the key is a secret, so the read path exposes only that it is present."
  test:
    scope: unit
    component: DriverConfig
    type: behavior
  criticality: high

INT-FC-R28:
  version: 1.0.0
  status: active
  statement: "Updating the driver config with an empty api_key MUST leave the stored key unchanged."
  rationale: "Editing the base_url or model must not force re-entering the key, so an empty key means keep the existing one."
  test:
    scope: unit
    component: DriverConfig
    type: behavior
  criticality: medium

INT-FC-R29:
  version: 1.0.0
  status: active
  statement: "Per-door MCP access (Basic auth) is a Console-wide runtime setting: each door round-trips its public fields and reports configured, and never returns its secret."
  rationale: "Each door's MCP Basic-auth credential is Console-wide, reconfigurable without a redeploy, and secret; the read path exposes only that a secret is set. (The worker's git push credential is a named git identity, INT-FC-R88, not a shared setting.)"
  test:
    scope: unit
    component: ConfigStore
    type: behavior
  criticality: high

INT-FC-R30:
  version: 1.0.0
  status: active
  statement: "The delivery index MUST serve list and status from an in-memory cache and refresh it from the source out of band, so a read request never triggers a scan."
  rationale: "Discovery scans the whole org, which is too slow to run on every page load; the read path reads a warm cache kept fresh by a background refresh."
  test:
    scope: unit
    component: DeliveryIndex
    type: behavior
  criticality: high

INT-FC-R31:
  version: 2.0.0
  status: active
  statement: "A delivery source MUST discover deliveries by the delivery/* scratch-ref namespace: one matching-refs enumeration per repo (the whole per-repo probe, so the org rescan's fan-out carries no second call), where zero refs is not a delivery, exactly one resolves the line - its records read from the ref at branch root, and the resolved name rides the derived state (scratch_ref) into every read and every compiled run - and more than one surfaces as an anomaly state naming the refs, never a silent pick. Each delivery's state derives through the shared records-based derivation."
  rationale: "The existence of a delivery/* ref IS the this-repo-carries-a-live-delivery fact (decision 0003), and the singleton is an enforced invariant, not a structural assumption: a reader that picked one of two refs would act on a line the operator cannot see. Local and GitHub discovery still agree - both feed the index with states derived by the one pure function; the local source reads the mount the checkout materialises, the remote source reads the ref itself."
  test:
    scope: unit
    component: DeliverySource
    type: behavior
  criticality: high

INT-FC-R32:
  version: 1.0.0
  status: active
  statement: "A deep link or refresh on a client-side route MUST serve the SPA app shell (index.html), not a 404, so /settings and delivery links load the app."
  rationale: "The app is served by the Python process with no nginx in front; without an app-shell fallback, a refresh or bookmark on any non-root route returns a JSON 404."
  test:
    scope: integration
    component: http app
    type: behavior
  criticality: high

INT-FC-R33:
  version: 1.0.0
  status: active
  statement: "The MCP doors the settings pane offers MUST be derived from the orchestrator's phase->studio map (the playbook plus each phase's owner studio), so a non-door like CSD never appears and the list cannot drift from the compiler."
  rationale: "CSD is a methodology applied locally, not a server; hand-copying the door list into the frontend put csd in it. Deriving it from one source keeps door credentials and the compiler in lockstep."
  test:
    scope: integration
    component: http app
    type: behavior
  criticality: medium

INT-FC-R34:
  version: 1.0.0
  status: active
  statement: "Cross-studio status MUST be served from a warm cache refreshed out of band; a read never queries the studios, and a studio being down never fails the read."
  rationale: "Querying estimatekit/protopane/platform-studio live on every page load would be slow and brittle; the background refresher warms the studio cache the way it warms the delivery index."
  test:
    scope: unit
    component: StudioStatusIndex
    type: behavior
  criticality: high

INT-FC-R35:
  version: 1.0.0
  status: active
  statement: "A delivery overview MUST map each studio's artifact status for the delivery's slug onto the five-phase line, so the cockpit shows what exists where; the intent+plan phase, which drives no studio, carries none."
  rationale: "The Console is the connective view of everything; one slug (the repo name) threads through every studio, and each phase shows its studio artifact beside its gate."
  test:
    scope: unit
    component: overview_dto
    type: behavior
  criticality: high

INT-FC-R36:
  version: 1.0.0
  status: active
  statement: "The org-wide studios view MUST report each connected studio's reachability."
  rationale: "The cockpit's top-level view of everything shows which studios (estimatekit, protopane, platform-studio, playbook-studio) are up."
  test:
    scope: unit
    component: studios view
    type: behavior
  criticality: medium

INT-FC-R37:
  version: 1.2.0
  status: active
  statement: "Establishing a delivery MUST be deterministic and credential-free: create or adopt the repo, lay down the scratch (mint its one delivery/<line-id> ref with the skeleton, refusing a second while any delivery/* ref exists, and naming an empty repository plainly rather than surfacing the git-data 409), ensure the default branch git-ignores the .delivery/ mount point (an unignored mount is a gitlink trap: one whole-tree git add stages the worktree as a gitlink and every later mount fails on it), and capture the customer's verbatim request, without requiring a worker credential; running the phases is a separate step."
  rationale: "REF-Delivery separates making a repo a delivery (and capturing the Scope input) from running the AI phases; the Console must not demand a model credential just to establish one."
  test:
    scope: integration
    component: http app
    type: behavior
  criticality: high

INT-FC-R38:
  version: 1.0.0
  status: active
  statement: "The Fleet view MUST list every org repo, joining each with the delivery index and platform-studio apps so a delivery, a live app, and a plain repo are all distinguishable."
  rationale: "The cockpit shows the whole floor, not only tagged deliveries; a repo's delivery status, onboarding, and live status come from three sources joined by name."
  test:
    scope: unit
    component: fleet
    type: behavior
  criticality: high

INT-FC-R39:
  version: 2.4.0
  status: active
  statement: "Mode is delivery-level: persisted with the delivery (its scratch config.json, committed on the line's ref and read at .delivery/config.json in a checkout), validated to known values, and authoritative over every run it compiles - one-shot compiles with no gate-suspend steps (one prompt to a shipped app). There is NO presence dial: the config read serves no presence field, the compiled workflow carries no presence env or label, and a stale presence key in an existing config.json is scrubbed on the next save. A save that changes nothing MUST commit nothing, so the line's revision does not move."
  rationale: "The executor is ephemeral pods running headless claude -p: no worker can pause for a human mid-run, so attended-vs-unattended had nothing to mean here - the dial was persisted, labeled, and displayed, but consumed by nothing (the entrypoint never read FC_PRESENCE). A one-shot worker that genuinely needs a human fails the attempt and the line parks degraded; the operator answers by re-driving the phase with feedback (INT-FC-R70), which serves the whole attended use case without pretending a pod can hold a conversation."
  test:
    scope: unit
    component: delivery config
    type: behavior
  criticality: high

INT-FC-R40:
  version: 2.0.0
  status: active
  statement: "Re-opening a phase MUST un-sign that phase's gate (its stamp reads pending again) and hand the record back to the PINNED record helper as opened-for-work - never a console-side edit of the block - so the re-opened record reads `status: in-progress` with the previous attempt's evidence (`reviewed:`, `finished:`, `attests:`) cleared and its provenance (`run`, `attempt`, `mode`, `started`, `credential_ref`) carried; every downstream record stays in place, flagged as present-but-needs-review, deleting nothing (REF-Delivery section 1, one of the two legitimate un-signing acts)."
  rationale: "An operator who spots a problem late must be able to send the line back to any earlier phase without losing the work already done downstream; the cockpit shows that work as stale rather than gone. v1 re-opened by replacing the gate date with PENDING and nothing else, which left a record reading `status: complete` and, worse, carrying the PREVIOUS attempt's `reviewed:` date - and stamp_gate.py takes a dated `reviewed:` as sufficient evidence and signs without a verdict, so the ordinary stamp command closes the NEW attempt's gate over the OLD attempt's review, silently, with no guard refusing (ai-assessment delivery/2026-08-11: the console re-open at d04ab52, the handoff rewritten end to end for attempt 2, and the stale date caught only because an agent happened to overwrite it by hand). reach_gate.py clears those fields on `--status in-progress` for exactly this reason and says so in its own comment; the console routed around a guard that already existed, which is anti-pattern 30. Running the pinned helper rather than mirroring its field list is what keeps the two from drifting again - the list grew `attests:` after the console's surgery was written, and the surgery never learned."
  test:
    scope: unit
    component: delivery config
    type: behavior
  criticality: high

INT-FC-R41:
  version: 1.0.0
  status: active
  statement: "Pausing or resuming a platform app MUST delegate to platform-studio (its pause_app/resume_app lifecycle toggle) and then refresh the fleet, so the Console shows the new live status without inventing its own deployment mechanics."
  rationale: "The platform owns app lifecycle; the Console is a cockpit over it, so a pause switch here is a call to platform-studio, not a second, divergent controller."
  test:
    scope: unit
    component: studios ops
    type: behavior
  criticality: medium

INT-FC-R42:
  version: 1.1.0
  status: active
  statement: "The Runs surface MUST read the executor's real state: list the Console's Argo Workflows (newest first, with mode and phase) and read one run's node DAG, both parsed from the executor's own output - the cockpit reflects the workflow, it does not simulate it."
  rationale: "Runs must connect to the actual executor (Argo), not a client-side guess; the graph a user sees is the workflow's live nodes."
  test:
    scope: unit
    component: workflow runner
    type: behavior
  criticality: high

INT-FC-R43:
  version: 1.0.0
  status: active
  statement: "Run controls MUST act on the real executor through the Kubernetes API (no Argo CLI/server is deployed): stop/terminate patch spec.shutdown, resume flips only the still-waiting Suspend nodes to Succeeded, and logs read the workflow's step pods - each control operates on the live Workflow, not a local proxy of it."
  rationale: "Operators need to stop, resume, and inspect real runs; with no Argo server present the Console drives the Workflow CR directly, and resume must touch only nodes that are actually suspended."
  test:
    scope: unit
    component: workflow runner
    type: behavior
  criticality: high

INT-FC-R44:
  version: 1.1.0
  status: active
  statement: "The project co-pilot chat MUST be an advisory agent distinct from the worker, with a SCOPED voice: an open delivery answers only through its own agent (the masthead pick) and never silently borrows the home co-pilot's driver, while a repo with no open line answers on the home driver (there is no delivery to carry an agent). It degrades to a not-configured signal until the right credential is set (never fabricating a reply), and once set it reasons over the phase context and the files the operator referenced. The default model is the cheapest Claude."
  rationale: "The operator needs to think through a phase with the delivery's real state in front of them, using a Console-side agent that advises rather than the autonomous worker that executes; it must be honest when no credential is configured, and the operator must always know WHICH agent answers - a delivery pane that silently switched to the platform-wide slot misattributed every reply."
  test:
    scope: unit
    component: driver co-pilot
    type: behavior
  criticality: high

INT-FC-R45:
  version: 2.1.0
  status: active
  statement: "A target's model MUST be configurable per target (a delivery OR a maintenance-only repo) and persist without touching git: the non-secret selection (agent/provider/base_url/model) in a Console-local runtime setting keyed by slug, and the credential in a namespace Secret keyed by slug. Neither is ever committed. A later drive reuses the persisted credential (sourcing the per-slug Secret) without re-entry, and the co-pilot prefers it over the global default. The delivery-level MODE stays in the scratch's config.json on the line's ref (a delivery always carries a live scratch ref); only the model selection leaves git."
  rationale: "Each target picks its own model (a subscription or a compatible endpoint), set once; the non-secret selection is operational config, the sibling of the git/MCP/driver runtime settings, not a delivery record of what happened, so it belongs Console-local beside the credential rather than committed to the repo. Storing it in .delivery/config.json forced a git write on every agent switch and, on a repo with no .delivery/, fabricated one just to hold agent config (issue #4)."
  test:
    scope: unit
    component: delivery config
    type: behavior
  criticality: high

INT-FC-R46:
  version: 2.0.0
  status: active
  statement: "The Console MUST offer a registry of named agents, each a saved ENDPOINT credential (provider + base_url + credential) plus an optional list of models it serves. Agents can be listed (never exposing the secret) and applied to the global driver or a target, selecting the agent AND a model SEPARATELY (from the agent's list or free-text), so one stored credential backs many models without re-entry; an agent with no credential cannot be applied."
  rationale: "An agent is a subscription or endpoint, not a model: welding one model into each saved agent forced five near-identical agents (one credential retyped five times) to run five models on one sub. Separating the endpoint credential from the model choice makes the credential a configure-once endpoint and the model a per-use pick, while keeping the secret server-side."
  test:
    scope: unit
    component: agent registry
    type: behavior
  criticality: medium

INT-FC-R47:
  version: 1.0.0
  status: active
  statement: "A repo carrying the 'foundry-hidden' topic MUST be excluded from the Fleet by default and only appear when hidden projects are explicitly requested, so noise repos (CI, libraries) stay off the board while remaining unhideable-by-mistake and recoverable."
  rationale: "Not every org repo is a project worth watching; hiding is controlled at the source (a GitHub repo topic) so it needs no per-repo UI state, and the board stays uncluttered by default."
  test:
    scope: unit
    component: fleet
    type: behavior
  criticality: medium

INT-FC-R48:
  version: 1.0.0
  status: active
  statement: "Each compiled worker container MUST specify an explicit command (the worker image's entrypoint), never rely on the image ENTRYPOINT, so Argo's emissary executor does not resolve the entrypoint from the image manifest - that resolution reads the pull secret, which the workflow controller cannot, and the pod fails to start."
  rationale: "A live drive failed at pod start ('failed to look-up entrypoint/cmd … secrets ghcr-pull is forbidden'); naming the command makes the run start deterministically without a manifest read."
  test:
    scope: unit
    component: WorkflowCompiler
    type: behavior
  criticality: high

INT-FC-R49:
  version: 1.0.0
  status: active
  statement: "Driving a delivery MUST accept an optional start phase and compile the remaining line from it, adopting the upstream phases from the studios that already hold their work: for a mid-line start, each compiled worker also receives the skipped phases' studio MCP doors, so it reads the adopted scope/design (estimatekit, protopane, …) rather than the .delivery/ records a skipped phase never wrote."
  rationale: "A repo can already carry an estimatekit scope, a protopane design, and code without any local delivery history; the operator must be able to jump straight to a later phase instead of re-running upstream work, and the worker started there must be able to read what it adopted."
  test:
    scope: unit
    component: WorkflowCompiler
    type: behavior
  criticality: medium

INT-FC-R50:
  version: 1.0.0
  status: active
  statement: "The worker's phase self-validation MUST accept the completeness contract the resolver derives from - a present, non-empty .delivery/ record - and MUST NOT require a 'status: complete' line the REF-Delivery records never carry (they stamp the gate 'pending', not a status), so a phase the agent actually finished self-validates to success instead of failing every retry."
  rationale: "A live drive proved the worker completed the scope phase (a real estimatekit project and a committed proposal.md) yet failed self-validation on a status:complete line no skill writes; the worker must validate what the domain reads - the record - not a second, conflicting contract."
  test:
    scope: unit
    component: worker-entrypoint
    type: behavior
  criticality: high

INT-FC-R51:
  version: 2.0.0
  status: active
  statement: "Applying a saved agent to a target MUST record {agent, model} in the target's Console-local selection (never in git), and a direct model set MUST clear the agent name, so the target's model control shows both the agent that backs it and the model chosen on it. The model is a control SEPARATE from the agent: the agent carries the credential and its available models, the selection carries the one model chosen."
  rationale: "With the model separated from the credential (R46), the target must remember two things, which agent backs it AND which of that agent's models it runs, so the control can show the agent selected and the model picked on it. Both are non-secret operational selection and live Console-local (R45), never committed."
  test:
    scope: unit
    component: AgentRegistry
    type: behavior
  criticality: low

INT-FC-R52:
  version: 2.0.0
  status: active
  statement: "In one-shot mode the worker MUST close each phase's gate only over the phase's own fresh-eyes adversarial review - its newest committed `.delivery/reviews/<record-stem>-*.md` by version order, produced by the adversarial-review skill inside the phase as a clean agent pass, ending VERDICT: PASS - and the stamp itself MUST be deterministic - written by the entrypoint, never by an agent; a missing review, or a newest review that does not end PASS, MUST exit non-zero so the executor retries fresh. Interactive mode MUST never self-stamp: its gates suspend for a human signature. The compiler MUST hand the worker its phase's gate name (FC_GATE) so the stamp can happen at all."
  rationale: "Choosing one-shot is the operator's standing pre-authorization of the gates ('one prompt to a shipped app'), but a live run proved workers rightly refuse to skip an unsigned gate - so unattended stalled forever. Auto-closing is only honest if something that did not write the record has examined it; the review earns the stamp, and keeping the stamp deterministic preserves the invariant that agents never sign."
  test:
    scope: unit
    component: worker-entrypoint
    type: behavior
  criticality: high

INT-FC-R53:
  version: 1.0.0
  status: active
  statement: "The cockpit's phase substance MUST be read from each studio's own REST API over the in-cluster internal Service port (east-west, past the OIDC sidecar) and rendered natively - scope from estimatekit's own data (the summary and audit, then the itemized requirement spine, phase decomposition, assumptions, and architecture; see INT-FC-R56), design from the protopane export - degrading to {} (and the UI to the phase's committed record) when the studio holds nothing or is unreachable. MCP remains the agents' door only."
  rationale: "MCP is a tool-calling protocol for models, not app-to-app RPC; the public /api is OIDC-gated for humans in browsers and must stay so. The deterministic UI read therefore rides the studio's REST on a port the Gateway never routes - naming the east-west trust boundary that pod-to-pod reachability already implied."
  test:
    scope: unit
    component: StudioGateway
    type: behavior
  criticality: medium

INT-FC-R54:
  version: 1.1.0
  status: active
  statement: "Every advisory co-pilot turn MUST carry the distilled contract of ITS context in its system grounding: delivery and home turns the REF-Delivery digest (the five phases, derivation from records, the frontmatter signed: line as the only gate truth, the per-mode gate policy, agents never sign), and maintenance turns the REF-Maintenance digest (the ticket loop, the three per-act ceremony modes, the verdict gate, derived state, agents never merge) - so advice speaks the governing contract; the WORKERS need no copy because every drive pulls the live skill from playbook-studio."
  rationale: "The workers who act load the real corpus at run time (the skill and its REFs over the playbook-studio door), but the co-pilots only advised from page context and drifted into generic project-speak; distilling each mode's contract into its turns' grounding keeps advice consistent with what the engine and workers will actually do, without shipping a second copy of the playbook."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: medium

INT-FC-R55:
  version: 1.0.0
  status: active
  statement: "A co-pilot turn MUST never be awaited on the request that starts it: the chat endpoints start the model call in the background and return a turn id at once, a poll endpoint serves {\"status\": \"running\"} until the reply (or the turn's error) lands, and an unknown or failed turn MUST degrade to a clear error - never a hung chat or a severed reply."
  rationale: "A grounded turn shells out to `claude -p` and legitimately runs minutes; every hop in front of the pod (oauth2-proxy's 30s upstream default, then the Gateway) holds a request open for less, so the synchronous POST was severed mid-turn and the operator saw a bare 'Error: 502'. Raising proxy timeouts only moves the cliff and couples infrastructure config to model latency; the turn's duration is the model's business, so the wire must not carry it."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: medium

INT-FC-R56:
  version: 1.0.0
  status: active
  statement: "The scope substance MUST itemize estimatekit's own data, read east-west from its project-files REST door (the read the MCP read_project_file mirrors): the requirement spine (id / category / description, phase-annotated from the matrix), the phase decomposition (which requirements fall in which phase), the assumptions register, and the architecture - guidelines, per-phase components, AND each phase's diagram as its .puml SOURCE. The diagram MUST be surfaced natively as source, never round-tripped through a third-party PlantUML server (which would ship a client's architecture off-cluster). Every section is additive over summary+audit and self-degrading; the committed proposal.md is the last-resort fallback, never the primary render."
  rationale: "The pane under-rendered scope as four counts + a raw proposal.md dump, so an operator could not read the requirements, the phasing, the assumptions, or the architecture at a glance - and 'a link is not substance'. estimatekit emits all of it as TSV + PUML under the project's data/ dir (architecture/ included, produced in the estimation phase), so the cockpit reads those files on the same internal door it already uses for the summary and shapes them in the outbound adapter. PlantUML has no in-repo renderer and the only browser path is a public server; shipping a client's architecture there is a privacy leak, and estimatekit's own slides summarise components+guidelines rather than rasterise, so source is the honest native form."
  test:
    scope: unit
    component: StudioGateway
    type: behavior
  criticality: medium

INT-FC-R57:
  version: 1.0.0
  status: active
  statement: "build_worker_launch MUST pin the delivery's studio key in the worker prompt - the repo slug (its last path segment, the same key the cockpit matches studios on, from one shared delivery_slug) - and instruct the worker to address every studio (scaffold / create / query estimatekit, protopane, platform) by EXACTLY that slug, never a reworded or prettier variant. The cockpit links a studio artifact to its delivery by exact slug, so a worker that coins its own project name orphans the artifact and the substance panes fall back to the record though real studio work exists."
  rationale: "A live delivery was estimated as `shattered-catacombs` while its repo (and cockpit slug) was `shatteredcatacombs`; the exact-match link missed, so the Scope pane rendered the raw proposal.md though a full audited 20-requirement estimation existed. The compiler already assumes one slug threads every studio - deriving that key from the repo at launch and telling the worker to use it verbatim makes the assumption enforceable at the point the worker acts, rather than trusting the worker to guess the convention."
  test:
    scope: unit
    component: WorkerLaunch
    type: behavior
  criticality: medium

# --- v3: the Maintenance mode (REQ-M1..M9, .delivery/proposal.md) ---
# Draft claims land with the plan (the correctness spec the plan gate signs);
# the build implements each attesting test and flips the claim to active as it
# passes. csd-intent treats draft as pre-implementation, so the audit stays
# clean until every claim is active - the build's done-definition.

INT-FC-R58:
  version: 1.0.0
  status: active
  derived_from: [REQ-M2]
  statement: "A repo's maintenance positions MUST be derived on read from the repo host and the pipeline (open issues, open PRs with their verdicts, unreleased commits, releases, deployment health) and stored nowhere: the derivation writes no file, keeps no store, and the same inputs MUST yield the same positions."
  rationale: "Maintenance stores no state of its own (REF-Maintenance section 6): the issue, the PR, the tag, and the deployment are the record homes, so the cockpit's positions are a pure read that cannot drift."
  test:
    scope: unit
    component: MaintenanceResolver
    type: behavior
  criticality: critical

INT-FC-R59:
  version: 1.0.0
  status: active
  derived_from: [REQ-M2, REQ-M3]
  statement: "The release train MUST be derived from tags and unreleased Conventional Commits: version now from the latest semver tag, unreleased commits counted by type, and the computed next version following fix=patch, feat=minor, breaking marker=major; no unreleased commits MUST mean no next version."
  rationale: "The train is the STATE concern's spine; the pipeline derives versions mechanically from commit types, so the preview must compute exactly what the release tooling will cut, or it lies."
  test:
    scope: unit
    component: ReleaseTrain
    type: behavior
  criticality: high

INT-FC-R60:
  version: 1.0.0
  status: active
  derived_from: [REQ-M1]
  statement: "The maintenance source MUST read open issues, open PRs, a PR's diff, review threads, and checks state over the GitHub API with the shared git token, and MUST degrade to empty on a missing credential or an unreachable API, never failing the read."
  rationale: "Reads ride the same token and degrade the same way as the delivery source: a cockpit pane renders what it can reach and never errors out because GitHub or the credential is away."
  test:
    scope: unit
    component: MaintenanceSource
    type: behavior
  criticality: high

INT-FC-R61:
  version: 1.0.0
  status: active
  derived_from: [REQ-M1, REQ-M6]
  statement: "A console merge or comment MUST be performed through the GitHub API as exactly the operation gh would perform (the same endpoint and payload semantics), under the console-role git identity, and MUST refuse when no git credential is configured."
  rationale: "Principle 4 (drive-through-owners): every write the Console causes is byte-for-byte what a human running the command would produce; the executing identity is the one assigned to the console role, and the docs state that plainly."
  test:
    scope: unit
    component: MaintenanceActs
    type: behavior
  criticality: critical

INT-FC-R62:
  version: 1.0.0
  status: active
  derived_from: [REQ-M3]
  statement: "The maintenance overview MUST serve the three concerns for every repo, including one mid-delivery: STATE as the release train plus the loop positions, SUBSTANCE as the selected item's native content, and ACTION as the drive surface with its mode - all derived, none stored."
  rationale: "The Maintenance tab is a sibling of the delivery cockpit: three concerns, each owning one region; the tab answers for every repo because maintenance is an always-on mode, not a post-delivery graduation."
  test:
    scope: integration
    component: http app
    type: behavior
  criticality: high

INT-FC-R63:
  version: 1.0.0
  status: active
  derived_from: [REQ-M3]
  statement: "PR substance MUST include the diff's actual content (changed files and patch text) read over the GitHub API so the cockpit renders it natively; a link out is not substance, and only an unreachable API degrades the pane to the link."
  rationale: "Jumping to GitHub to read a diff breaks the single pane (the design's annotation 1); the diff text is the substance, rendered in the same Monaco surface the worktree already uses."
  test:
    scope: unit
    component: MaintenanceSource
    type: behavior
  criticality: high

INT-FC-R64:
  version: 2.0.0
  status: active
  derived_from: [REQ-M4]
  statement: "A maintenance drive MUST take its mode from the request, validated to gated, one-shot, or direct, defaulting to gated when unstated. The mode the operator picks is the mode that runs: no downstream rule MAY rewrite it, and in particular who authored the PR MUST NOT downgrade one-shot to gated. Whether the console's merge token may land a given PR is the repository's own gate (branch protection, CODEOWNERS, required checks); a merge the repository refuses MUST park carrying GitHub's reason."
  rationale: "The ceremony is chosen per act with gated the default (REF-Maintenance section 4), and the press that starts the drive IS the authorization for what that mode does. Keying the automatic acts on PR authorship put a second copy of the repository's merge policy in the orchestrator, where it could only drift from the real one and could not be configured except by editing Python. It also sorted by the wrong thing: it admitted the resolver agent's diff and refused a colleague's, and it sat ABOVE the FAIL branch, so it silently suppressed the bounded re-drive (INT-FC-R75) - an act that lands nothing - as well as the merge. Observed live: a one-shot drive on a colleague's open PR ran resolve and review to completion, recorded a FAIL, and parked with no re-drive, the reason visible only in a side rail. Delegating to the repository keeps the guarantee where it is enforceable and reports the refusal honestly."
  test:
    scope: unit
    component: MaintenanceModes
    type: behavior
  criticality: critical

INT-FC-R65:
  version: 1.1.0
  status: active
  derived_from: [REQ-M6, REQ-M4]
  statement: "In one-shot mode the merge MUST fire only over a recorded fresh-eyes VERDICT: PASS with green checks, as the engine's deterministic act, and nothing else merges: an UNRECORDED or missing verdict, or a PASS whose checks are red, MUST park the PR for the operator, and a FAIL, whatever its checks, goes to the bounded re-drive (INT-FC-R75), which parks it for the operator once the budget is spent. No agent ever merges."
  rationale: "The sibling of INT-FC-R52: the review earns the act and the engine performs it, so agents never merge in any mode, and a red CI blocks the merge whatever the verdict says (REF-Maintenance section 5). UNRECORDED is named at 1.1.0 (INT-FC-R66 3.0.0): section 5's third state records no verdict, so it parks exactly as a missing one does, and it is no FAIL, so it never re-drives the resolve; the PR waits for an independent reviewer. The 1.1.0 text also states the FAIL path as INT-FC-R75 defines it, the re-drive within its attempt budget, and gives a FAIL that one act whatever its checks say, since the re-drive revises the change the red checks ran on; park is for what the engine cannot act on, so the two claims read the same act the same way."
  test:
    scope: unit
    component: MaintenanceJudge
    type: behavior
  criticality: critical

INT-FC-R66:
  version: 5.0.0
  status: active
  derived_from: [REQ-M6]
  statement: "A PR's verdict MUST be read by the playbook's one verdict reader, the vendored inbox sweep's decision_of (REF-Maintenance section 5), and a re-drive's findings MUST be the body of the review it returns as deciding the FAIL. The console MUST hand it the PR's reviews oldest first by submitted_at, mapped from the REST fields to the reader's (user.login to author.login, author_association to authorAssociation), with the PR's author and, where the console would merge, the identity it merges as, every login compared case-insensitively. The console MUST NOT keep a rule of its own: this is ONE derivation, read identically by the lifecycle strip, the substance pane, the fleet inbox, and the one-shot judge, and the vendored fixture table fixtures/verdict/verdict-reader.json is its test."
  rationale: "Every runner reads one reviewer's word the same way, so a review that passes one gate passes them all (issue #25). A copy of the rule kept beside the playbook's drifted from it, and so did a second search for the newest FAIL body that a re-drive threaded; both are gone, and the reader that decides the verdict also names the review whose findings become the work order (playbook#437). The reader's rules carry what the console's copy argued for. A VERDICT line is an instruction the engine obeys, so only a review by the repo's owner, a member or a collaborator takes part, which draws the line where GitHub already draws it and needs nothing configured. A review by the PR's author or by the merger records nothing (UNRECORDED): a change graded by whoever wrote it, or passed by whoever lands it, is not fresh eyes, and the resolver, the reviewer and the console's own acts run as distinct identities (INT-FC-R88). A PASS counts only on an approving review, the one object the merge helper merges over, so no plain comment opens the one-shot merge gate (INT-FC-R65). The adapter exists because the console reads reviews from the REST API, whose fields and order differ from what the reader takes; the merger is empty for a home's PR, which is theirs to merge (INT-FC-R132). 5.0.0 is MAJOR because readings change: an approving review ending FAIL read awaiting under 4.x and reads fail; a request-changes review ending PASS read awaiting and now leaves the older counted verdict standing; the PR author's own PASS or FAIL read awaiting and reads unrecorded; a PASS from the identity the console merges as read pass and reads unrecorded; and an approving PASS from a deleted account (no login) with a write association read awaiting and reads pass."
  test:
    scope: unit
    component: VerdictParser
    type: behavior
  criticality: high

INT-FC-R67:
  version: 1.0.0
  status: active
  derived_from: [REQ-M5]
  statement: "A maintenance drive MUST compile resolve-ticket and review-pr as worker runs in the same launch shape as delivery phases (skill pulled live from playbook-studio, credential by ref, explicit container command, bounded retries and deadline), and reconcile-docs as a drive-able check run."
  rationale: "The console renders and drives what the skills already do by hand: the workers pull the live skill, so the console never carries a copy of the process, and the launch guards match the delivery compiler's."
  test:
    scope: unit
    component: MaintenanceLaunch
    type: behavior
  criticality: high

INT-FC-R68:
  version: 1.0.0
  status: active
  derived_from: [REQ-M7]
  statement: "The fleet inbox MUST derive maintenance-inbox's queue org-wide (open issues, PRs awaiting review, unreleased commits, red default branch, drifted deployment) per repo, and MUST exclude archived repos from every signal."
  rationale: "The strip renders the same derivation the maintenance-inbox skill produces by hand; an archived repo is a torn-down line, so it never demands attention (the fleet's repo scan already filters archived, and the inbox must not resurface them)."
  test:
    scope: unit
    component: FleetInbox
    type: behavior
  criticality: high

INT-FC-R69:
  version: 1.0.0
  status: active
  derived_from: [REQ-M9]
  statement: "The Console MUST serve no /mcp route, MUST call no GitHub Projects API, and MUST write no maintenance state file (no .maintenance/ directory, no tracker copy): the repo host's own records and the pipeline are the only stores the maintenance mode reads."
  rationale: "The standing negatives the design pinned: the would-be consumer of a console MCP door is a Claude session that already holds the playbook; Projects boards are links out; and derived state means no second store to drift."
  test:
    scope: integration
    component: http app
    type: behavior
  criticality: high

INT-FC-R70:
  version: 1.0.0
  status: active
  statement: "A gate re-drive MUST carry the operator's feedback as one act, durable before live: a drive with feedback appends it to .delivery/journal.md (dated, under the gate's heading) BEFORE the run is submitted - a failed journal write refuses the drive - and threads it verbatim into the re-driven phase's worker prompt as a revision clause, the first compiled worker only, never the downstream phases."
  rationale: "The gate is a review conversation with two outcomes - sign (accept) or re-drive (revise) - but an unsteered re-run with unchanged inputs just reproduces the same record. The feedback is the review's verdict: journaled in the scratch so the why survives whatever the re-driven worker rewrites (the mirror of sign_gate's date stamp), and in the worker's prompt so the phase revises what exists instead of starting over."
  test:
    scope: unit
    component: OrchestratorService + workflow compiler
    type: behavior
  criticality: high

INT-FC-R71:
  version: 1.0.0
  status: active
  statement: "The co-pilot MUST know and speak its own contract: its grounding names it toolless by design, lists the operator's actual controls (sign, re-drive with feedback, drive), and defines the staging convention - a fenced `redrive` code block the console pre-fills into the Re-drive composer, never an act the co-pilot performs. The driver adapter MUST enforce toollessness at launch (claude -p --tools \"\"), not merely request it in prose."
  rationale: "Observed live: ungrounded about its own affordances, the co-pilot attempted a tool call (RemoteTrigger), burned its bounded turn on the denial, and narrated the failure back at the operator. Declared AND enforced, the turn spends itself on advice - and the redrive block gives that advice a deterministic place to land, the same agent-speaks-a-convention idiom as the review verdict line (INT-FC-R66)."
  test:
    scope: unit
    component: driver co-pilot
    type: behavior
  criticality: medium

INT-FC-R72:
  version: 1.1.0
  status: active
  statement: "Seating a worker credential or agent for ANY target MUST NOT write to the target repository: it persists only to Console-local settings and secrets. A repo with no open line (no delivery/* scratch ref; a maintenance-only target) MUST NOT gain one from credential or model configuration; only the model SELECTION (a Console-local setting) and the per-slug credential Secret are written, both Console-side. The set-model and apply-agent paths call no repo write."
  rationale: "Seating a maintenance worker credential once wrote .delivery/config.json onto the target's main (issue #4: vf-library ed82e3f), fabricating a delivery scratch just to hold agent config and violating REF-Maintenance's derived-state doctrine (no state stored in the repo). The credential Secret by slug was right; the git write was not. Moving the selection Console-local (R45) removes the write entirely, so a bare repo stays bare."
  test:
    scope: unit
    component: delivery config
    type: behavior
  criticality: high

INT-FC-R73:
  version: 1.0.1
  status: active
  statement: "A saved agent's single stored credential MUST be usable with any of several models without re-entering the credential: the model is selected independently of the credential for a delivery, a maintenance target, and the home co-pilot, so five models on one subscription need one saved agent, not five. Applying the same agent to two targets with different models MUST reuse the one credential and differ only in the selected model."
  rationale: "The user's ask: give one Claude subscription or one Anthropic-compatible endpoint+key, then pick which model from a separate dropdown, rather than creating five credential sets to run five models on the same sub. The credential is the endpoint (R46); the model rides the per-target selection (R45/R51)."
  test:
    scope: unit
    component: agent registry
    type: behavior
  criticality: medium

INT-FC-R74:
  version: 1.0.0
  status: active
  statement: "A phase whose committed record carries a non-complete, non-gate status (most importantly status: aborted, a degraded stop) MUST resolve as DEGRADED, never as a done, signable gate. The cockpit reads the record's own frontmatter status - the same work-truth the engine's validators read - not only the gate date."
  rationale: "A degraded stop stamps status: aborted and leaves the gate unsigned. Reading only the gate date made that indistinguishable from a healthy phase awaiting a signature, so the cockpit showed a broken run as 'done' and even offered a Sign button. The frontmatter status is the machine-readable signal the worker already writes; the console must honor it."
  test:
    scope: unit
    component: StateResolver
    type: behavior
  criticality: high

INT-FC-R75:
  version: 1.0.0
  status: active
  derived_from: [REQ-M6]
  statement: "In one-shot mode a recorded fresh-eyes VERDICT: FAIL MUST re-drive the resolve with the reviewer's findings threaded in as the work order, revising the open PR rather than opening a second one, bounded to a fixed number of resolve attempts per ticket; a still-failing review once the budget is spent MUST degrade to the operator, and a re-drive with no persisted credential MUST park rather than loop. The attempt count MUST be DERIVED by counting the ticket's one-shot resolve runs on the executor, so a pod restart cannot uncap it. A PASS still merges (INT-FC-R65); no agent ever merges."
  rationale: "One-shot is the operator's standing pre-authorization to reach a shipped resolution unattended, but parking on the first FAIL stalled that the way an unsigned gate once stalled the delivery line: a bad resolution - a decision that only defers the ticket while stamping Closes - sat merge-adjacent instead of being corrected. The reviewer's findings are the work order (REF-Maintenance section 5), so feeding them back into a fresh resolve is the honest self-correction, the sibling of the gated re-drive-with-feedback (INT-FC-R70) and the delivery retry budget (INT-FC-R19). The bound - derived, never stored, like the one-shot ledger itself - keeps a genuinely delivery-sized ticket that no ticket-sized change can pass from looping forever: it degrades to a human, exactly as a spent retry budget does."
  test:
    scope: unit
    component: MaintenanceJudge
    type: behavior
  criticality: high

INT-FC-R76:
  version: 1.0.0
  status: active
  statement: "A delivery's worker wall-clock timeout is a per-delivery setting chosen beside the model (default 1 hour, floored to a safe minimum), persisted Console-local and never reset by a later model or agent change; every compiled worker template's activeDeadlineSeconds is that timeout."
  rationale: "A from-scratch build+ship is a multi-hour job, but every phase shared a flat 30-minute deadline, so real builds were killed at the wall and their retries re-cloned and hit the same wall - a live game rebuild lost a working engine three attempts running. The right budget is the app's, not a constant, so it is the delivery's own choice, stored beside the model (R45/R51) and carried into activeDeadlineSeconds (R25). Preserved across a model change because put_setting replaces the whole field set."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R77:
  version: 1.0.0
  status: active
  statement: "build_worker_launch MUST tell every worker `interaction=auto` and instruct it never to prompt a human, resolving open decisions by the assumption protocol - in BOTH modes, since a pod holds no human even for an interactive-mode line (whose gates the operator signs from the Console between steps, never inside a running pod)."
  rationale: "The delivery skills default to interaction=manual (a human at a terminal): design-session runs a live customer session, and every phase may ask questions. A worker pod is headless `claude -p` with no human reachable (R39), so a skill left on its manual default hangs the pod waiting for input that never comes. The launcher passes interaction=auto so the skill takes its autonomous path (design-session authors and locks the look with no live session; every phase resolves by the assumption protocol). This is not the retired presence dial (R39): that was an operator-set, persisted, consumed-by-nothing config; interaction=auto is prose in the prompt, always auto, never persisted or operator-tunable, and the skill actually reads it."
  test:
    scope: unit
    component: WorkerLaunch
    type: behavior
  criticality: high

INT-FC-R78:
  version: 1.0.0
  status: active
  statement: "compile_maintenance_workflow MUST append the same `interaction=auto`, never-prompt directive to EVERY maintenance worker prompt (resolve, review, reconcile-docs, and the one-shot review step), mirroring INT-FC-R77 for the maintenance path - whose workers are the same headless pods (R39) reached by no human, but whose prompts are assembled here, never through build_worker_launch."
  rationale: "The maintenance skills (resolve-ticket / review-pr / reconcile-docs) can hit an open decision - an ambiguous ticket, a judgment call in a review - and on their manual default would stop to ask, hanging the headless pod (R39) exactly as a delivery skill would. build_worker_launch carries the R77 directive for delivery phases, but maintenance prompts are built in maintenance_launch, which never calls it, so without this the directive never reached a maintenance worker. Appended at the single compile choke point so it rides every act and the one-shot review alike; prose in the prompt, always auto, never persisted or operator-tunable (not the retired presence dial, R39)."
  test:
    scope: unit
    component: MaintenanceLaunch
    type: behavior
  criticality: high

INT-FC-R79:
  version: 2.1.0
  status: active
  statement: "The Console MUST offer a Close-line act that ends a delivery line by minting the annotated delivered/<slug>/P<n> tag on the scratch ref's tip and pushing it BEFORE deleting the delivery/<line-id> ref - tag then delete, mandatorily, since the annotated tag is what keeps the line's orphan history reachable, and its annotation carrying the attests: default-branch SHA the line's build record pinned when it pinned one (never a fabricated value when it did not, and never a value read through a transport error - that aborts the close), so a follow-on reads the whole delivered marker - existence, phase, date, attests - from the tag object alone, never the tag's tree - leaving the repo, its default branch, its code, and every studio artifact untouched. It MUST be reachable from an open line's cockpit UNCONDITIONALLY - in every derived status and under every run state (none, running, suspended at a gate, failed, degraded) - and it MUST hold a slot of its own, never sharing one with a control that can displace it and never taking the primary contextual button (which always drives the line's current phase, so the close can never masquerade as a phase's own action; a delivered line is on Learn, since Learn leaves no record and the resolver keeps phase=learn past it, and a learned line re-drives Learn). On a line whose status is learned (INT-FC-R106: the journal frontmatter proves Learn executed) the close IS the contextual next act, and the cockpit MUST mark it as such by EMPHASIS in its own slot, never by moving it into another. That emphasis MUST carry the cockpit's DOMINANT visual weight whenever no run is in flight: the close is the filled control and the idempotent Learn re-drive drops to an outline. A run that wants attention (failed, running, parked at a gate) keeps the fill on its own act, since that is both the more urgent one and the exact state whose primary the close must never occupy. It MUST refuse on a repo with no scratch (no line to close), refuse more than one delivery/* ref as the anomaly it is (never closing a silent pick), stop any live run of that delivery first (so the close never yanks the scratch from under a worker mid-phase), and the repo MUST then read as a live project with no open line, its record trail still readable through the tag."
  rationale: "A line has to end, and the operator may want to end it at any point and for any reason - skip Learn entirely because the journal held nothing worth codifying, finish up after it, abandon a line mid-flight, walk away from one whose run keeps failing - so the act is always on, in its own slot, in every state. It is not the primary button: the derived pointer is the line's current phase (on a delivered line, phase=learn - the resolver routes there, next=reconcile-delivery), so making the big button Close would tell the operator to skip the very phase the line says is current - the first reported contradiction. v1.1.0 answered the second (a learned line kept a Drive Learn primary, telling the operator to re-run a demonstrably finished phase) by moving the close INTO the primary slot on a learned line and giving its own slot to the Learn re-drive - and that trade only held while the primary had nothing more urgent to say. The primary chain resolves the run state first, so a learned line with a failed, running, or gate-parked run gave the primary to that run and the secondary to the re-drive, and the close - the console's only way to end a line - rendered NOWHERE (seen live on alexandria-main: status learned, Build+Ship failed x4, no reachable close). Hence the invariant is now positional, not contextual: one dedicated slot, always occupied, with the learned line's nudge carried by emphasis, which no run state can evict; the primary keeps naming what it does, re-driving a learned phase as the idempotent no-op it is. v1.3.0 then made that emphasis actually emphatic: v1.2.0 spent it on a red BORDER, on an outlined button standing next to a filled primary, and fill outranks border - so the loudest control on a done-and-learned line still read 'Re-drive Learn' and the operator asked why the console was pointing at a finished phase (reported on wttg3-helper: all five phases done, Learn stamped, run Succeeded). What moves is weight, not position, which is what keeps the positional invariant whole - the flip is off in exactly the states whose primary a run owns, so the close is never promoted into a slot it would have to vacate. The close is deterministic (tag, push tag, delete ref, over the Git Data API) and touches no branch history, so it can never cut a release. The ordering is load-bearing: deleting the branch untagged makes the line's history garbage-collectable, while the annotated tag anchors the orphan history - the durable delivered-marker and the anchor are one object, and a follow-on line reads a prior line's records straight through its tag (git show delivered/<slug>/P<n>:build.md). Refuses on a non-delivery and supersedes live runs first, mirroring the drive path's own supersede, so the act is safe to press in any state - including on top of a live run."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: medium

INT-FC-R80:
  version: 1.1.0
  status: active
  statement: "The Console MUST NOT implement the Learn-phase close policy as a launch-prompt override: build_worker_launch adds no phase-specific close-or-keep clause for learn (it gets the ordinary phase tail), leaving the interaction-aware close to the reconcile-delivery skill, which reads the interaction=auto the launcher already passes (INT-FC-R77). On interaction=auto (a console pod, no operator watching) the skill journals its summary and LEAVES the scratch for the operator's Close-line act (INT-FC-R79); on interaction=manual (a hand-run session with no console) it closes the line itself (the same tag-then-delete-ref close), since there is no button to press."
  rationale: "The cockpit's Learn pane IS .delivery/journal.md, so an unattended reconcile that drained the scratch erased the ONLY record the operator could still read - the very thing they opened the cockpit for. The fix belongs in the playbook, not a console prompt: most behaviour should be skill-driven, and the skill already knows its interaction mode. So the skill keys on it - auto keeps the scratch for the console's explicit Close-line act (R79), manual closes the line itself because no console is present - and the console stays agnostic (this claim guards that it adds no bespoke close clause). The worker entrypoint already leaves learn's commit and exit to the worker (FC_RECORD is empty), so a journal-and-leave is a valid success."
  test:
    scope: unit
    component: WorkerLaunch
    type: behavior
  criticality: high

INT-FC-R81:
  version: 1.0.0
  status: active
  statement: "The Fleet view MUST carry a per-delivery ACTIVITY axis read from the executor - 'running' (a worker is live for the delivery's slug, a queued Pending included), 'suspended' (a worker is parked on a gate), 'idle' (the executor is reachable but nothing is live) - joined on the background refresh tick and matched on the normalized slug, orthogonal to the git-derived delivery status. When no executor is wired or it is unreachable the activity MUST be absent (unknown), never 'idle', so the board never implies a stopped runner it could not verify; a non-delivery repo MUST carry no activity."
  rationale: "delivery_status is a pure GitOps derivation from committed records and gate stamps; it cannot tell a working runner from a parked one, so a board built on it alone read 'awaiting gate' while a worker churned underneath - unreadable even to a reader holding the source. The live truth is the executor's run phase (already read for the Runs surface and superseding), so the fleet joins it as a second axis the cell renders in motion. Sourced from the executor (list_runs), never inferred from the eventually-consistent git scan, or it would inherit the same lag that hid the run; and unknown is kept distinct from idle so an off-cluster board stays honest rather than falsely calm."
  test:
    scope: unit
    component: fleet
    type: behavior
  criticality: high

INT-FC-R82:
  version: 1.1.0
  status: active
  statement: "The fleet inbox MUST surface a 'running' signal for each maintenance run in flight (Running or Pending) right now, read from the executor by the run's labels (act, ticket, full repository identity and execution kind) and ranked at the TOP of the queue so a ticket being tackled is visible and never re-driven; a live resolve MUST suppress its own ticket's open-issue row, so the ticket reads as in-progress rather than untouched intent. An unavailable executor MUST retain the last observed queue with unavailable/stale freshness and MUST NOT invent new running signals."
  rationale: "The inbox derived only from GitHub state (issues, PRs, the release train), so a resolve running for a ticket still showed as a plain open issue with no hint it was being worked - inviting a re-drive of in-flight work, the same class of mistake as the merged-PR stall. The executor already tracks the run (the activity axis, R81), so joining its running maintenance runs surfaces 'being tackled' at the top of the queue; folding the live resolve's issue into that one row keeps the ticket from appearing twice. Read on the background tick like the activity axis, never on a page load, and unknown-when-off-cluster rather than invented."
  test:
    scope: unit
    component: FleetInbox
    type: behavior
  criticality: medium

INT-FC-R83:
  version: 1.0.0
  status: active
  statement: "maintenance_positions MUST also read the recently-closed PRs (merged and closed-unmerged) and expose them as `recent_closed` positions carrying their state ('merged' | 'closed'), so a ticket whose resolve PR has left the OPEN list resolves definitively: a merged PR reads as landed/done (close the ticket if the merge did not auto-close it), a closed-unmerged PR as re-drive - never as an ambiguous stall or a false 'the work never landed'. A closed PR is terminal, so its verdict and checks are NOT derived; only its state is matched to the ticket (by branch/title, like an open PR)."
  rationale: "The console read only OPEN PRs, so a merged resolve PR vanished from the positions and the lifecycle strip called a landed ticket 'stalled ... the work never landed ... Re-drive it', inviting a re-do of already-merged work (seen live: SolveOS #7, PR #14 merged, ticket still open). A Succeeded resolve run is proof a PR was opened (the worker's completeness check fails the run otherwise), so no-open-PR means merged or closed - and reading the recently-closed PRs, keyed by GitHub's merged_at, makes that distinction definitive instead of a guess. Bounded to the recently-updated closed PRs, since only recent ones bear on a still-open ticket."
  test:
    scope: unit
    component: MaintenanceResolver
    type: behavior
  criticality: medium

INT-FC-R84:
  version: 1.0.0
  status: active
  statement: "ONE rule identifies the PR that resolves ticket #n across every maintenance surface (the lifecycle strip, the one-shot judge, the worker's completeness check): its branch carries the ticket in the resolver's {type}/{n}-{slug} form AND its title or body references #n. It MUST be branch-AND-text, so a coincidental branch (a release/{n}-rc that merely starts with the number) or a stray #n mention alone never qualifies, and the surfaces never disagree about 'the PR for #n'."
  rationale: "The one-shot judge already required branch AND a #n text reference (its guard against a release/{n}-rc branch that coincidentally starts with the number), but the strip and the entrypoint used branch OR text - so they would count that coincidental branch as the PR while the judge excluded it, and a resolve PR missing #n from its text would be linked by the strip yet parked by the judge. Unifying every surface on the judge's strict branch-AND-text (one shared matcher, pr_resolves_ticket) keeps them aligned and preserves the coincidental-branch guard; the client, lacking the PR body, matches on branch AND title, which a compliant `type(#n): subject` PR satisfies."
  test:
    scope: unit
    component: MaintenanceResolver
    type: behavior
  criticality: medium

INT-FC-R85:
  version: 1.1.0
  status: active
  statement: "Each compiled maintenance worker's completeness phase (FC_PHASE) MUST name ITS OWN role, not the drive's act: a one-shot resolve's review step is stamped maintenance:review (validated by a posted VERDICT on the PR that resolves the ticket), not maintenance:resolve (validated by the resolve's own open PR). The review completeness check MUST resolve its PR from the ticket (the open PR carrying it) for a resolve's inline review, or from the PR number for a standalone review, then confirm a VERDICT line was posted: any of review-pr's three endings, VERDICT: PASS, VERDICT: FAIL, or VERDICT: UNRECORDED. Every driven review's prompt, standalone and a one-shot resolve's inline step alike, MUST name the same three endings as the review's last line."
  rationale: "Both steps of a one-shot resolve were stamped maintenance:{act}=maintenance:resolve, so the review step ran the resolve completeness branch and passed on the resolve's already-open PR: a review that crashed before posting its VERDICT still read Succeeded, defeating the retry safety-net (the judge still parks fail-closed on a missing verdict, so no wrong merge - but the run lies). Stamping each step's own role, and resolving the review's PR by the ticket it carries, makes a green review mean a verdict was actually posted. UNRECORDED is named at 1.1.0 (INT-FC-R66 3.0.0): a reviewer whose identity is the PR's author or the merger ends its completed review on VERDICT: UNRECORDED (the review-pr skill), which a console with one git identity can reach, and a check that knew only PASS and FAIL read that posted review as missing, retried it until the attempt budget was spent, and parked the run Failed. It completes the act and records no verdict, so the judge still parks the PR for an independent reviewer (INT-FC-R65) and nothing re-drives on it. The prompt names the same three endings, so the reviewer is told exactly what the check accepts."
  test:
    scope: unit
    component: MaintenanceLaunch
    type: behavior
  criticality: medium

INT-FC-R86:
  version: 1.0.0
  status: active
  statement: "The maintenance loop MUST offer a Close-ticket act that closes a ticket whose PR merged but did not auto-close it (byte-identical to gh issue close, under the shared identity), and the ticket cockpit MUST route to it: the pane resolves the ticket's PR merged-aware (the open review record, else the recently-closed merged/closed one), so a merged ticket shows Close - not a meaningless Re-drive - its centre reads 'PR #n merged' not 'No PR', and the pane, its next-act, and the strip agree."
  rationale: "A merged PR that did not auto-close its ticket (the closing keyword missing from the PR body, before that skill fix) left the ticket lingering merged-but-open. The cockpit read ONLY open PRs, so the centre said 'No PR to merge yet' and the act said 'Re-drive #n' - both wrong, and both disagreeing with the strip's own 'PR #n merged / close #n' (which reads recent_closed, R83). Making the pane merged-aware like the strip, and adding the gh issue close act, lets the operator finish the loop instead of re-doing already-merged work."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: medium

INT-FC-R87:
  version: 1.0.0
  status: active
  derived_from: [REQ-M6]
  statement: "An operator-pressed resolve re-drive over a PR that a fresh-eyes review already returned VERDICT: FAIL MUST thread that review's findings in as the work order, so the worker REVISES the open PR (one ticket = one PR, INT-FC-R84) rather than opening a second one. The findings MUST be DERIVED on the drive from the ticket's open PR when the caller sends none; a first resolve, or a re-drive over a still-awaiting or passing PR, MUST carry no feedback and get the fresh 'open the PR' prompt. This holds in every ceremony a resolve runs in."
  rationale: "The operator-pressed twin of the one-shot engine's self-correction (INT-FC-R75) and the sibling of the delivery gated re-drive-with-feedback (INT-FC-R70): the reviewer's findings are the work order (REF-Maintenance section 5), so a re-drive over a FAIL must revise the PR, never open a duplicate. Before this, a gated re-drive threaded nothing, so the worker got the first-resolve 'open the PR' prompt and tried to open a second PR for a branch that already had one; and the FAIL verdict - derived from the PR's newest review - never cleared, because a gated resolve runs no review and the cockpit offered no way to drive a fresh one, so the ticket dead-ended at FAIL. Deriving the feedback server-side, from the same open-PR match every surface shares (INT-FC-R84), keeps the operator's one press honest without wiring a second control; the cockpit separately offers the Review act in the FAIL state so a fresh verdict can supersede the stale one."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R88:
  version: 1.0.1
  status: active
  statement: "A git identity - a display name, a commit email, a GitHub login, and a PAT - MUST be a named runtime setting the Console saves, lists, and deletes at runtime, never exposing the token value (only whether one is set), so a machine-user credential is entered once and reused, exactly like a saved agent."
  rationale: "Per-agent identities need somewhere to live that a redeploy does not erase and a git checkout never sees. Reusing the agent-registry pattern (a ConfigMap of public fields plus a write-only Secret) keeps the identity a runtime setting, not code, so the operator adds the machine-users (the Programmer's and the Reviewer's, say) from Settings and the token never rides the page back."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R89:
  version: 1.1.0
  status: active
  statement: "The compiler MUST inject the git identity assigned to each step's catalog agent as its own ConfigMap+Secret refs (FC_GIT_USER / FC_GIT_EMAIL / FC_GIT_TOKEN), so a maintenance:resolve step (the Programmer) and a maintenance:review step (the Reviewer) can carry DIFFERENT GitHub accounts; a step whose agent the operator assigned no identity MUST get NO git identity at all (no FC_GIT_* env), so its worker has no git credentials until one is configured and assigned; only the Secret ref ever rides the Workflow, never the token."
  rationale: "The Reviewer must be a different account than the Programmer, because GitHub refuses to let an account approve its own PR; the only place that split can happen is the Job's environment, resolved by the console (which holds the Settings) and passed to the pure compiler as refs. There is no built-in default identity: a step whose agent is unassigned injects no git env, so a misconfigured console fails loudly at push time rather than silently committing as some hidden fallback account."
  test:
    scope: unit
    component: DeliveryCompiler
    type: behavior
  criticality: high

INT-FC-R90:
  version: 2.0.0
  status: active
  statement: "A role -> identity map MUST assign each catalog agent the Console hands steps to (the five phase workers, the Programmer, the Reviewer, the Release Manager) and the console's own acts to a git identity, managed at runtime; an unknown role key MUST be dropped and an empty value MUST clear a role to unassigned (no identity), so the operator can share one identity across many agents or separate them all. The map is blank until the operator fills it - there is no seeded assignment."
  rationale: "The operator's ask is exactly this freedom: make Delivery one identity shared with maintenance-resolve, Review another, or split all seven, or collapse to one - decided in Settings, not in code. A validated map keyed on ConfigMap-safe role keys is the whole mechanism; the compiler and the console-acts token both read it."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R91:
  version: 2.0.1
  status: active
  statement: "The set of the console's own identities MUST be treated as 'ours' for DISPLAY only: a PR authored by none of them is badged as one the console did not write, and the merge control names that. It MUST NOT gate any act, and it MUST NOT decide whose review counts (INT-FC-R66 reads the playbook's verdict rule instead)."
  rationale: "Splitting the resolver and the reviewer into two accounts (INT-FC-R88) is what lets a driven review approve a driven PR at all, and the identity set was generalised to keep the automatic gate working across that split. But the set was doing two jobs, and only one of them was its own: knowing which accounts the console holds tokens for is real information worth showing the operator, while deciding who may merge and whose word is authoritative are the repository's question and the playbook's verdict rule respectively. Keeping the set as a badge preserves what it genuinely knows and removes it from every decision it was answering by proxy."
  test:
    scope: unit
    component: VerdictDerivation
    type: behavior
  criticality: high

INT-FC-R92:
  version: 1.0.0
  status: active
  statement: "The console's OWN GitHub acts (merge, comment, close, and the org reads) MUST read their git token from the identity assigned to the 'console' role, resolved live so a Settings change needs no redeploy, and MUST have no token (its acts and org reads refuse) when no console identity is assigned - there is no shared fallback secret."
  rationale: "The console acts outside the Argo Jobs, so its identity is not covered by the per-phase Job injection; the operator asked for it to be configurable in Settings too. Resolving the console-role identity's Secret in the composition root, read live per call, makes the console's writes carry the chosen bot identity; an unconfigured console has no token until the operator assigns one, so it never acts as a hidden default account."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: medium

INT-FC-R93:
  version: 1.0.0
  status: active
  derived_from: [REQ-M2]
  statement: "Maintenance positions MUST derive an author-declared complexity (low/medium/high) and priority (lowest/low/medium/high/highest) from a clean marker in the issue body - a GitHub Issue-Form field block (a '### Complexity' or '### Priority' heading whose next non-empty line is the value) or a hand-typed '<Key>: <value>' trailer line - matched case-insensitively against the known vocabulary and stored nowhere; an absent or unrecognised value MUST yield empty (no badge), never a guess."
  rationale: "The operator wants to see how big and how urgent each ticket is without defining custom labels across every repo. Reading a clean body marker (the same 'author speaks a convention the tool reads' idiom as the verdict line and GitHub's Closes #3) keeps a clean repo zero-setup and the signal invisible until a ticket carries it; deriving it on read with everything else keeps the position a pure read that cannot drift (INT-FC-R58). Rejecting unknown values to empty means a typo shows no badge rather than a wrong one."
  test:
    scope: unit
    component: MaintenanceResolver
    type: behavior
  criticality: medium

INT-FC-R94:
  version: 1.0.0
  status: active
  derived_from: [REQ-M2]
  statement: "A maintenance position MUST surface the ticket's native GitHub Issue Type (the org-level type name, e.g. Bug/Feature/Task) read directly from the issue payload's type field, derived on read and stored nowhere; a ticket with no type MUST yield empty (no badge)."
  rationale: "Unlike complexity and priority, the issue type is a first-class org-level attribute GitHub already owns and puts on the issue itself (readable with the console's plain repo token, no Projects scope and no per-repo config), so the console reads the native field rather than inventing a marker to re-define what already exists. Absent type reads empty, the same invisible-until-set discipline as the body markers."
  test:
    scope: unit
    component: MaintenanceResolver
    type: behavior
  criticality: low

INT-FC-R95:
  version: 1.0.0
  status: active
  statement: "Every compiled Workflow (delivery and maintenance alike) MUST carry a garbage-collection policy in its spec: a podGC strategy of OnWorkflowCompletion (reclaiming the worker pods once the line reaches ANY terminal phase, success OR failure, with a delay that keeps their logs briefly readable) and a ttlStrategy that reclaims the Workflow object itself, a failed run's record kept longer than a succeeded run's."
  rationale: "Without a GC policy a completed Workflow keeps every worker pod forever - Argo deletes pods only under podGC, and the Workflow object only under ttlStrategy - so a finished run strands its debris until a human sweeps it. Found live: the poisoned e2e drive left 75 Error-state worker pods stranded in the namespace for days. OnWorkflowCompletion (not OnWorkflowSuccess) is the point: a FAILED run must reclaim its pods too, which is exactly the run that otherwise strands them. podGC keeps the Workflow object, so the Runs surface still shows the run from the object's status (node graph, failure messages - read there, never from the pods); ttlStrategy then bounds the objects too, failures kept a week for investigation and successes a day. Shared by both compilers so the delivery and maintenance paths never drift."
  test:
    scope: unit
    component: WorkflowCompiler
    type: behavior
  criticality: high

INT-FC-R96:
  version: 1.0.0
  status: active
  statement: "An open ticket carrying the 'foundry-hidden' label MUST be excluded from the fleet Inbox's 'issue' signal by default and only appear when hidden tickets are explicitly requested, mirroring the Fleet's repo-topic hide (INT-FC-R47) at issue scope; every other inbox signal (running, red-ci, pr-review, drift, unreleased) is unaffected."
  rationale: "Not every open issue is inbox-worthy: a wontfix kept open for tracking, a backlog placeholder. Hiding is controlled at the source (a GitHub issue label) exactly like the repo-level hide, so it needs no per-issue Console state and the queue stays uncluttered by default while staying recoverable."
  test:
    scope: unit
    component: FleetInbox
    type: behavior
  criticality: medium

INT-FC-R97:
  version: 1.0.0
  status: active
  statement: "The fleet inbox MUST fold an open PR's own row (its 'red-ci' or 'pr-review' signal) into its ticket's open-issue row when that PR already resolves a still-open ticket in the same repo (the shared pr_resolves_ticket rule, branch-AND-text, INT-FC-R84), so the ticket surfaces once - never as both an 'issue' line and a 'PR' line for the same concern. A PR that resolves no open ticket in the repo MUST keep surfacing its own row unaffected."
  rationale: "Once a maintenance line opens a PR toward a ticket, the inbox derived the issue and the PR as two independent signals, so the same concern doubled up in the queue (seen live: an open ticket and its own resolve PR both listed). The issue row is the ticket's stable identity end to end (REF-Maintenance section 6); the PR is that same concern's review state, not a second concern, so its row folds away rather than the reverse - the same 'one concern reads once' discipline the running-run fold (INT-FC-R82) already established for an in-flight resolve."
  test:
    scope: unit
    component: FleetInbox
    type: behavior
  criticality: medium

INT-FC-R98:
  version: 1.1.0
  status: active
  derived_from: [REQ-M7]
  statement: "The fleet inbox MUST fold a ticket's open-issue row into its 'running' row for ANY maintenance run in flight for it (resolve or review alike), not resolve only, and MUST carry the ticket's loop stage - 'in-progress', 'open', 'awaiting-review', 'awaiting-merge', 'changes-requested', or 'checks-red' (derived from its linked open PR via the shared branch-AND-text rule, INT-FC-R84) - on every issue and running row, so the Inbox shows whether a ticket is stuck at a gate, awaiting merge, sent back for changes, or being worked on right now without a click into the Maintenance pane. The number a run's label carries is its ACT's target, and the acts target different namespaces (a resolve's is the ticket, a review's is the PR), so a review run's number MUST be mapped back to the ticket its PR resolves (the same branch-AND-text rule) before it folds, before its row deep-links to a ticket, and before it reads a title; a live review MUST likewise suppress its PR's own 'pr-review' or 'red-ci' row, so a run in flight is ONE row whether its concern is a ticket or a bare PR; and a running row MUST name the namespace of every number it shows ('review PR #16 for #13'), never a bare '#16' that matches nothing else in the queue."
  rationale: "A review run in flight for a ticket's PR left the ticket's plain open-issue row showing 'resolve' beside its own running row, since only resolve-act runs folded the issue row - inviting a re-drive of work already moving. And a ticket with an open PR already at a gate, passed and awaiting merge, or FAILed its fresh-eyes review showed the same bare 'resolve' as a freshly-filed ticket, so the operator could not tell which of the Inbox's tickets needed a first resolve, a merge, a fresh review, or another resolve pass over a FAILed verdict (REF-Maintenance.md §5: a failing verdict goes back to resolve) without opening each one (issue #9). v1.1.0 answers the miss that fix still had: folding compared the run's raw label number against ticket numbers, and a review's label carries the PR's, so the fold matched for resolve runs and NEVER for review runs - the very case v1.0.0 was written for. Seen live with three concurrent reviews (playbook #13/#14, foundry-console #29): six rows for three concerns, each ticket reading as untouched intent beside a running row whose number appeared nowhere else in the queue, since R97 had already folded that PR's own row away as its ticket's. The unit test passed throughout because it fed the review run an ISSUE number the launcher never sends. Hence the namespace is now part of the claim, not an assumption: map before folding, and print which namespace each number belongs to so a reader can join the two on sight."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: medium

INT-FC-R99:
  version: 1.0.0
  status: active
  derived_from: [REQ-M1]
  statement: "Every compiled Workflow (delivery and maintenance alike) MUST reserve exit code 65 as a distinct terminal 'delivery-scale' stop, kept apart from the degraded stop (64), and MUST make Argo refuse to retry EITHER (the retry expression, built from the one _TERMINAL_EXITS source of truth, holds for every worker in both compilers). A blind retry can neither clear a degraded blocker nor shrink a delivery-sized ticket, so both fail fast and park the run."
  rationale: "The resolve worker emits 65 when it judges a maintenance ticket too big for a maintenance scope - a rework, a new module, a new major, which REF-Maintenance section 1 calls a delivery line, not a big ticket (issue #13). Keeping 65 distinct from the degraded 64 lets the console read the parked run's intent: a delivery-scale stop earns the operator a 'Switch to Delivery' offer, a degraded stop does not. Deriving the retry expression from one _TERMINAL_EXITS tuple means a future sentinel is added once and both the delivery and maintenance compilers inherit it, so the two paths never drift on which exits are terminal."
  test:
    scope: unit
    component: WorkflowCompiler
    type: behavior
  criticality: high

INT-FC-R113:
  version: 1.0.0
  status: active
  derived_from: [REQ-M1]
  statement: "A resolve worker that finds the ticket's fix lives in ANOTHER repo MUST park on a distinct terminal exit (66) that Argo refuses to retry, kept apart from the degraded (64) and delivery-scale (65) stops; AND the exit codes and ticket labels declared across the compiler (Python), the worker entrypoint (shell), and the maintenance pane (TypeScript) MUST be held equal by test, not by comment."
  rationale: "65 and 66 are the two ways a valid ticket is unresolvable in the repo holding it - its SIZE and its LOCUS - and they earn opposite operator acts, so the console must tell them apart. Live (playbook-studio#8): a reconcile filed a playbook lesson on the studio app's repo instead of the corpus, the resolve agent correctly opened its PR where the code actually lived, and the completeness contract - which can only see PRs in the ticket's own repo - exited 1 four times, burning ~24 minutes to report FAILED while the real fix sat in an open, green PR. No retry could ever have passed. The cross-language constants get their own gate because the failure is silent in the worst direction: a worker exiting a code the compiler does not list as terminal is RETRIED, which is precisely the waste 66 exists to end, and the three files had been kept in agreement by nothing but a comment saying to keep them in agreement."
  test:
    scope: unit
    component: WorkflowCompiler
    type: contract
  criticality: high

INT-FC-R100:
  version: 2.0.0
  status: active
  derived_from: [REQ-M1]
  statement: "Switching an over-scope ticket to a delivery line MUST read the prepared delivery prompt back off the ticket from the LATEST comment carrying the delivery-prompt marker, and from the ticket's own body when no comment carries it or the marked comment holds no text after the marker (\"\" only when the ticket has neither), and add the foundry-hidden label to the ticket (additive, the #12 mirror at issue scope); AND the maintenance pane's state MUST exclude foundry-hidden tickets from its backlog by default, revealed only on an explicit include_hidden, so a switched ticket actually leaves the loop and is not merely marked. The switch opens no delivery line: the operator does that through the existing establish action with the prompt pre-filled."
  rationale: "Issue #13: once the resolve worker judges a ticket delivery-scale it parks (exit 65) and leaves the prepared prompt as a marked comment. Switching reads that prompt so the Delivery form pre-fills with the agent's own words rather than the operator re-typing them, and applies foundry-hidden. #12 hid a labelled ticket from the FLEET INBOX only (INT-FC-R96); the maintenance PANE still listed it, so hiding had to be extended to the pane's own read for the ticket to leave the loop, with the same include_hidden reveal the Fleet and Inbox already use (INT-FC-R47/R96) so a deep-link to a hidden ticket still resolves. Reading the prompt before the label write means a degraded read still lets the hide proceed; the write refuses without a git credential, the fail-closed rule every maintenance act follows (INT-FC-R61). The body fallback is the 2.0.0 statement (issue #108), MAJOR because a ticket with no marked comment reads its body where 1.x read \"\", so an attestation of the old text breaks: a terminal session's handoff consolidated an app's asks into umbrella tickets whose body IS the delivery brief, labelled delivery-scale with no marked comment, so the console offered the switch and pre-filled nothing, and the operator retyped a brief the ticket already held. The marked comment still wins when present: a ticket the worker judged carries the raw ask in its body and the brief in the comment, so the body is the request only when nothing was prepared beside it. A marked comment with nothing after the marker prepared nothing, and reads the same way."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: medium

INT-FC-R101:
  version: 1.0.0
  status: active
  statement: "Each Fleet item MUST carry the joined platform app's manifest ROLE (ADR-032) - 'parts' for an app that makes up the Foundry itself, 'output' for an app it built and runs - and MUST be null when the repo joins no manifest app (a bare repo or an in-flight, not-yet-onboarded delivery), so the cockpit can set the platform apps apart from the apps the Foundry delivers without inventing a second source of truth."
  rationale: "foundry.yaml already splits apps into parts (the Foundry) and output (its deliveries), and platform-studio's list_apps surfaces that role per app; the Console just threads it onto the fleet join it already computes. The view groups the parts apps under one labelled, collapsible header rather than colouring them, keeping the board's only status colour the paused-app amber; a repo that is no manifest app carries no role and reads as ordinary fleet, never as part of the platform."
  test:
    scope: unit
    component: fleet
    type: behavior
  criticality: medium

INT-FC-R147:
  version: 1.0.0
  status: active
  statement: "Each Fleet item whose repo is one the Foundry is built OUT OF rather than deployed AS - the platform repo, and the playbook - MUST carry role 'core', outranking any manifest role the apps join would give it. The platform repo is named structurally (ADR-032 gives the Foundry one canonical source repo and N deploy branches of it, so the name does not vary by install). The playbook's repo MUST be resolved by asking playbook-studio for the upstream of the clone it owns, and when that answer is unavailable for ANY reason - the studio unreachable, refusing, or managing no clone - the row MUST stay unmarked rather than be guessed."
  rationale: "The board renders every repo the org holds, grouped by manifest role, which left the two things the Foundry is actually made of reading as ordinary tenant repos: the substrate that renders every teams/ folder, and the corpus every phase, agent and skill is pulled from. Neither can ever earn a 'parts' row - INT-FOUNDRY-001 holds parts+output in exact bijection with the teams/ folders and neither has one, which is why foundry.yaml declares them beside the app lists (as platform and playbook) instead of inside them - so the absence was structural and no onboarding could ever fix it. 'core' is the board's word for that declaration. It outranks the manifest role because the two are structurally not apps: an app entry claiming one of those slugs is the anomaly to surface, not a reason to demote the row. The playbook's slug is asked rather than stated because playbook-studio owns the working clone and so cannot be stale about its own upstream, where a console-side literal would strand on a rename - the failure playbook-studio's own INT recorded when a reconcile guessed the repo from an app's name and misfiled the whole maintenance loop. Unknown stays unmarked for the same reason: a guess would brand some other repo the corpus."
  test:
    scope: unit
    component: fleet
    type: behavior
  criticality: medium

INT-FC-R102:
  version: 1.1.0
  status: active
  statement: "The worker's fresh-eyes review verdict parse MUST recognise VERDICT: PASS or VERDICT: FAIL wherever it occurs in the committed review artifact, case-insensitively and independent of surrounding markdown markup (e.g. bold emphasis) or trailing prose after it, rather than only as a literal, exact-match last line."
  rationale: "Issue #25: a live design-gate review printed \"**VERDICT: PASS**\" followed by its supporting explanation instead of ending on it, and the old parse (the very last non-blank line, exact string match) read that real PASS as unparsed and failed a passing gate, blocking a one-shot line on a review that had actually passed. The prompt still asks the reviewer to end on the verdict; the parse now tolerates a reviewer that does not comply to the letter, without weakening the FAIL side."
  test:
    scope: unit
    component: worker-entrypoint
    type: behavior
  criticality: high

INT-FC-R103:
  version: 1.1.0
  status: active
  statement: "When a phase's own record arrives at the worker's gate step already carrying a dated `signed:` (an agent hand-signed its own gate), the worker MUST fail safe: strip the signature back to `pending`, clear the self-written review date, commit that correction to the remote, and still verify the phase's committed fresh-eyes review - never fail open by skipping that verification and surfacing the record as done-signed."
  rationale: "Live regression (2ez4tv intent+plan): the worker agent hand-wrote `signed:`/`reviewed:` dates into the frontmatter it authored, despite mode=interactive and the launch prompt's explicit 'Do not sign any gate'. The old gate step keyed solely on `signed: pending`, so a self-signed record skipped the review entirely, exited 0, and the console painted the phase done-signed with zero fresh eyes; and because the agent pushes its record during its own turn, the forged date was already authoritative on the remote - a later failing review would have parked the run while the next phase's pre-flight still read a closed gate. Stripping (not degrading) keeps the line moving: the review still runs, and the gate closes only the legitimate way for the mode."
  test:
    scope: unit
    component: worker-entrypoint
    type: behavior
  criticality: high

INT-FC-R104:
  version: 2.0.0
  status: active
  statement: "A stamp that claims a fresh-eyes verdict MUST carry its committed evidence: the worker locates the phase's newest review artifact under `.delivery/reviews/` (the files named `<record-stem>-*.md`, record-stem = the phase's record filename without .md, newest by version order so `-r10` follows `-r9`), writes no review of its own, and passes that repo-relative path as `--review-log` on every stamp_gate.py invocation carrying `--review-verdict`; step 6's in-mount commit carries an artifact the phase left uncommitted in the same commit as the stamp; the vendored stamper refuses a claimed verdict without the artifact, and re-reads the file's LAST `VERDICT` token (case-insensitive, markdown-tolerant - the INT-FC-R102 parse rule), which must be PASS. Stamps that close over an already-recorded `reviewed:` date and pass no `--review-verdict` - the cockpit's Sign - are unchanged."
  rationale: "The worker's verdict grep was a fast-fail inside one ephemeral pod: nothing durable proved what the reviewer actually said, so a signed gate's `reviewed:` date pointed at evidence that no longer existed. Committing the verbatim output and making the stamper re-read its last VERDICT token turns the claim and the evidence into one file that cannot disagree: an auditor answers 'what did the review actually find?' from the repo alone, and a forged, absent, or failing verdict refuses deterministically at the stamp instead of riding a caller's word."
  test:
    scope: unit
    component: worker-entrypoint
    type: behavior
  criticality: high

INT-FC-R105:
  version: 1.0.0
  status: active
  statement: "Resuming a delivery run parked on a gate suspend MUST refuse while the delivery's FRESH derived state says that gate is unsigned (awaiting-gate), naming Sign as the act that approves and releases; the check reads the world, never the warm cache. A resume of a delivery-named run whose delivery the console cannot resolve refuses too, and a non-delivery (maintenance) run resumes untouched. Once the gate is signed, resume proceeds - it stays the mechanical fallback for a run that stayed parked after its sign."
  rationale: "Resume was a raw suspend release with no gate check, and the cockpit's derived state is a warm cache that lags the worker's push by a refresh tick - so in that window the Sign card had not rendered yet, Resume was the only visible act, and a live operator released an unsigned proposal gate; the design worker then correctly refused the unsigned upstream gate and parked degraded (exit 64), burning the phase. The guard closes the bypass at the server, where staleness cannot reach: sign_gate already reads fresh state for the same reason."
  test:
    scope: unit
    component: service
    type: behavior
  criticality: high

INT-FC-R106:
  version: 1.1.0
  status: active
  statement: "A delivery whose four gates are all signed AND whose .delivery/journal.md opens with a frontmatter block carrying a dated `learned:` MUST resolve to status 'learned' (phase stays learn, learned_on carries the stamp's date, next act = close the line), so the cockpit derives that Learn already executed and points the operator at the Close-line act instead of Drive Learn. A journal with no leading frontmatter, no dated `learned:`, or an unclosed fence resolves 'delivered' exactly as before; the stamp is ignored while any gate is unsigned (the line's derived pointer wins). The stamp is written by reconcile-delivery when the reconcile completes on the unattended path - the resolver only reads it. The derivation MUST be total over the cockpit, the phase strip included: on a learned line the Learn node reads DONE and carries the stamp's date (`done · learned <date>`), never 'current' - the strip treats the stamp as Learn's record, since Learn is the one phase that files none. Live executor state still outranks it (an in-flight re-drive of Learn shows as running), and an un-stamped Learn still reads current."
  rationale: "Learn is the one phase that leaves no record and closes no gate, so a delivered line kept reading phase=learn / Drive Learn even after a learn run succeeded - the operator could not tell a finished Learn from an un-run one without opening the journal (the reported confusion). The journal frontmatter stamp makes Learn's completion derivable exactly like every other phase's record: progress stays a pure function of the committed scratch, no tracked state. It matters doubly once reconcile files its lessons as tickets: the recommendations live outside the scratch, so re-driving an already-learned line buys nothing and the honest contextual next act is the deliberate close. v1.0.0 landed the stamp in the resolver and spent it on the two buttons only, leaving the phase strip - the operator's first read of the line - blind to it: the strip upgrades a node to done from record_present alone, which is permanently false for Learn, so it fell through to is_current (pinned at learn forever past the stamp) and said 'current' on a line the masthead was badging LEARNED and whose primary already said Re-drive Learn (reported live on wttg3-helper). A derivation that stops at some of its readers is not derived, it is duplicated; hence the claim is now total over the cockpit, and the strip reads the stamp as the record it stands in for."
  test:
    scope: unit
    component: StateResolver
    type: behavior
  criticality: high

INT-FC-R107:
  version: 2.3.0
  status: active
  statement: "Forcing a fleet refresh MUST be an explicit action endpoint - POST /api/fleet/refresh - that runs the same rescan the background tick does (the delivery index, the studio status, the fleet inbox and repository metadata, the inbox and every repository's metadata unconditionally rather than on their cadence); GET reads stay warm-cache-only (INT-FC-R30/R34), and refreshes serialize on a lock so a manual rescan and the background tick never interleave. The rescan MUST NEVER be awaited on the request that starts it (the same rule INT-FC-R55 holds the co-pilot turns to): the org-wide reads routinely outlast the 30s proxy chain in front of the pod, so the endpoint starts the rescan in the background and returns a turn id at once, and the SPA polls the shared turn endpoint for the fleet the rescan produced (or the rescan's error). The SPA's poll carries its own give-up deadline, and crossing it MUST NOT be reported as a failed refresh OR abandoned: the rescan is unbounded server-side and keeps running, so the control reports it as still running, re-reads the warm cache, and keeps watching the same turn at its calm cadence until the turn lands, errors, or the turn store forgets it - the produced fleet reaches the board without a reload and without a second rescan - reserving the failure report for a rescan that actually errored."
  rationale: "The masthead's refresh control exists so an operator returning after a burst of work sees the current floor now; re-reading the warm caches answers byte-identical data until the background tick lands, so the control must be able to trigger the scan itself. Making that an explicit POST action keeps the read-path invariant intact: a page load still never scans the org. The endpoint originally answered the rescanned fleet synchronously, which - once a git identity was assigned to the console role and the scan had real org-wide reads to do - reproduced the exact bare-502 failure INT-FC-R55 already fixed for the co-pilot turn: a request held open across dozens of sequential GitHub calls outlasts oauth2-proxy's 30s upstream default, so the edge severed it before the fleet ever reached the operator. Routing the rescan through that turn then left it under the client deadline sized for a chat turn, where a 180s server-side model bound makes the deadline a bound plus headroom; the rescan has no such bound, so its deadline is only a wait limit - and reporting a crossed wait as 'Refresh failed' told the operator the opposite of the truth for a rescan that completed seconds later, with a page reload the only way to see it. Stopping at 'still running' then abandoned the turn: the one cache re-read on the way out raced the rescan it was waiting for, so 'the board will catch up' was a promise nothing kept - the operator manually reloaded and never once saw the control finish (issue #46); watching the turn to its actual end makes the note resolve to the landed rescan's time on its own."
  test:
    scope: integration
    component: http
    type: behavior
  criticality: medium

INT-FC-R108:
  version: 1.1.0
  status: active
  statement: "A terminal run's logs MUST survive the executor's pod GC: the background refresh tick captures each terminal run's log tail into the snapshot store once, off the same executor read that judges one-shot drives (an empty capture marks the run as swept, so a lost run is probed once, never per tick), and a run-log read whose live pods are gone MUST serve the stored snapshot. Metadata reads consume the published observation without performing capture. The capture is best-effort per row. A live log-source outage is reported as unavailable unless the retained snapshot can satisfy the read."
  rationale: "The compiled Workflow GC's a finished run's pods an hour after completion while its row stays listed for weeks (ttlStrategy), so a superseded or failed run went dark long before the operator was done with it - the reported pain: re-driving destroys the previous run's logs. The capture must ride the background tick rather than a page read, because a run that finishes while no cockpit is open would otherwise lose its logs to pod GC before anything observed the terminal transition; the minute tick sits well inside the pod-GC delay."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R109:
  version: 1.0.0
  status: active
  statement: "Run logs MUST be readable per node: a node-scoped read returns only that node's pod lines - live from the executor when the pods answer, filtered out of the stored snapshot when they are gone - matching a pod to its node by either pod name form Argo emits (the node id itself, or a name ending in the node id's trailing token)."
  rationale: "The band's inspector is a master-detail surface: clicking a step must show that step's logs, not a whole-run dump the operator greps by eye. The same pod-matching rule must apply to live pods and snapshot lines, or a run's logs would change shape the hour its pods are reclaimed."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: medium

INT-FC-R110:
  version: 1.1.0
  status: active
  statement: "The run-retention horizons MUST be an operator setting, not compiled constants: the pod GC delay (hours) and the success/failure Workflow TTLs (days) live in the console's generic run-retention setting, are read live per compile into every Workflow's GC block (delivery and maintenance alike), and default to 1h / 7d / 30d when unset. Read values clamp to sane bounds, unparsable values fall back to the defaults, the failure TTL never clamps below the success TTL, and the snapshot store's prune horizon IS the failure TTL - so a run's row and its log file always expire together. The prune MUST reclaim a run's retained record with its log file, and a record with no log file once its own last write passes the horizon, so no retained record outlives the horizon."
  rationale: "How long history stays is the operator's call, and it spans three mechanisms (pod GC, Workflow TTL, snapshot pruning) that silently drift apart if configured separately: a row that outlives its file shows an empty pane, a file that outlives every row is unreachable disk. One setting read at compile time keeps the three aligned and makes a retention change take effect on the next drive, with no redeploy."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: medium

INT-FC-R111:
  version: 2.0.0
  status: active
  statement: "Both playbook delivery-record helpers MUST be delivered to the pod by the worker image, never left to the skill pull: reach_gate.py and stamp_gate.py are vendored from ONE playbook pin, baked into the worker image, and exported as FC_REACH_HELPER / FC_STAMP_HELPER for the agent as well as the engine. The AGENT is the only writer of its record: the compiled prompt MUST name the baked helper paths and the run's provenance (FC_RUN, FC_MODE, FC_CREDENTIAL_REF) for the agent to hand to the helper, and the entrypoint MUST NOT run the record helper or otherwise mutate the record between the agent's turn and the fresh-eyes review - the reviewed bytes are the agent's last commit, and the only post-review writer is the stamp."
  rationale: "Both helpers live in ONE playbook skill folder (deliver-engagement/) while a pod pulls only its own phase's skill, so every phase after Scope structurally arrived without them - and three phases of one live delivery each hand-authored the frontmatter REF-Delivery section 1 says is never hand-authored, re-deriving the same schema at real token cost (playbook-studio#2). Baking the helper is the delivery mechanism. v1 also had the entrypoint re-run the helper over the record before the review with the current attempt's provenance; on a re-drive of a line already parked at its gate that rewrote run/mode/credential_ref in the working tree, uncommitted, and the fresh-eyes reviewer correctly refused a gate whose on-disk record no committed review covered (moments-app delivery/2026-08-25 - every design re-drive burned its budget on that wall). Provenance now reaches the frontmatter through the agent's own helper invocation, the same front door an attended session uses; a sloppy block fails loudly through the existing guards (the 4b forgery strip, step 5's pending-only match, the stamper's refusals, the reviewer) instead of being silently repaired."
  test:
    scope: unit
    component: worker-entrypoint
    type: behavior
  criticality: high

INT-FC-R112:
  version: 1.1.0
  status: active
  statement: "The vendored helper pin MUST be checkable without coupling this repo to the playbook: PINNED.json is the single home for the pin (repo, path, commit, and a SHA-256 per helper), written only by update-vendored-helpers.sh from the bytes it just wrote, and the suite MUST re-hash the vendored files against it offline on every push. Comparing the pin with the playbook upstream is an OPERATOR act on their own credential (check_pin_drift.py), and NO workflow may reach the playbook repo or ask for a cross-repo playbook credential - the suite MUST assert that absence. The pinned files MUST be held to LF by .gitattributes, and the suite MUST assert that too, so the bytes a checkout hands the hash are the bytes the repo holds on every platform."
  rationale: "A hand-edited vendored copy is a re-implementation wearing a pin's clothes, and the README forbade it in prose alone - that half is free and offline, so it is enforced. The other half is NOT this pipeline's business: the vendored pins exist because the private playbook repo holds no cross-repo credential here, and a scheduled workflow fetching it (added and reverted, issue #34) needed a new secret and made this repo's CI depend on another repo - inverting the hermetic property the vendoring exists to provide. A pin bump is a deliberate act; asking whether one is stale belongs to a person who already holds access to both repos. Asserting the absence of that coupling is what keeps it from returning by accident. v1.1.0 closes the gap between the two: a pin is byte-exact by construction, but git stores these LF and translates them to CRLF on a checkout with core.autocrlf on (the Windows default), so every recorded hash missed and both readers - the offline suite and the operator's drift check - reported drift on a tree that had none. A false alarm here is worse than a silent one, because the advice it carries is to re-pin, which records the translated bytes and breaks the pin for CI and every other platform; the same translation puts a CRLF on a shell script's shebang, leaving the kernel looking for an interpreter named bash with a carriage return. Holding the bytes still is what lets the hash mean what it says."
  test:
    scope: unit
    component: vendor-pin
    type: behavior
  criticality: medium

INT-FC-R114:
  version: 1.0.0
  status: active
  statement: "Seating a model credential (a direct set_delivery_model, or set_agent's save path) MUST run a lightweight authenticated preflight against the resolved endpoint, using the exact auth selection the worker/co-pilot use, before the credential is persisted. An explicit 401/403 answer MUST reject the save (fail-closed on an answer) and MUST NOT seat the credential; a transport failure, a timeout, or no driver wired MUST NOT reject the save (fail-open on no answer) - the credential is seated and a later real run is the judge."
  rationale: "A credential was only ever checked for presence (does a Secret exist?), never validity, so the console showed a green tick over a wrong or expired key and the first real sign of trouble was a build-ship worker dying on a 401, hours into a delivery (issue #30). Fail-open on a transport/timeout error keeps a flaky or slow network from turning a save into a false 'invalid' - only an explicit auth answer may block it."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R115:
  version: 1.0.0
  status: active
  statement: "A studio's MCP tool call that is REFUSED MUST raise, not return an empty result. The gateway MUST inspect both shapes MCP reports a refusal in - a JSON-RPC error envelope, and a result carrying isError - and raise a StudioToolError carrying the studio's own reason, so a caller can tell a refusal from an unreachable studio and from a legitimately empty read."
  rationale: "The gateway read tools/call responses through .get(\"result\", {}) and inspected neither refusal shape, so a refused call returned [] and every caller saw 'the studio answered, with nothing' - indistinguishable from an empty read. create_app_repo's failure to seed a new repo therefore reached establish as {}, and the try/except that existed to handle exactly that could never fire, because nothing was ever raised. A refusal has to be loud at the transport seam or it cannot be handled at any layer above it."
  test:
    scope: unit
    component: HttpStudioGateway
    type: invariant
  criticality: high

INT-FC-R116:
  version: 1.1.0
  status: active
  statement: "establish MUST branch on WHY platform-studio could not template a greenfield. A studio that is absent or unreachable, a studio answering that it holds no write credential, and a studio refusing the name as no lowercase DNS label WHEN THE REPOSITORY IS ALREADY THERE, MUST fall back to the bare create-or-adopt (the platform is opt-in, so a delivery stays establishable without it); an already-existing repository MUST be adopted; ANY other refusal MUST fail the establish, surfaced as a 422, rather than proceeding onto the repository it names - INCLUDING that same name refusal over a repository that does not exist, which is a greenfield the caller named. Each outcome MUST be recorded, so 'born bare' is never silent."
  rationale: "One blanket except Exception treated three different outcomes as the same non-event, and the one that mattered - platform-studio created the repository and then could not seed the scaffold into it - is invisible from the outside: the repo exists, is named right, carries a description, and reads to every later phase as an ordinary new app. proxiverso established that way and would have carried its delivery scratch and none of the app contract all the way to build-and-ship, where the absence finally bites. Failing at establish costs one retry; failing at build costs every phase in between. The name refusal joined the degrades at 1.1.0: establish routes pre-existing org repos through the same create_app_repo, whose one 'name' is both the DNS-label app name and the repo name, so a mixed-case repo the operator never got to name (SolveOS) blocked its own delivery with a 422 nobody could act on - a refusal about a name, read as a scaffold that failed halfway. It joined them NARROWLY, gated on a create-vs-adopt read of the store, because the refusal itself cannot tell the two cases apart: the studio validates the string and never reaches the host, so the identical message arrives for a repo that is there and for one the caller just mistyped. Widening it to both would rebuild this claim's own bad state - a repo carrying no contract, reading to every later phase as an ordinary new app - on the one path where the caller DID choose the name and the 422 costs them a single retype. A store that cannot answer the read answers no, so the unknown falls to the refusal."
  test:
    scope: unit
    component: OrchestratorService
    type: invariant
  criticality: high

INT-FC-R117:
  version: 1.2.0
  status: active
  derived_from: [REQ-M1]
  statement: "The worker MUST reserve a distinct terminal exit code (67) for an agent run that hit the MODEL's own session/usage limit - including a limit scoped to one MODEL rather than to a time window - kept apart from the degraded (64), delivery-scale (65), and wrong-repo (66) stops, and Argo MUST refuse to retry it (it is added to the one _TERMINAL_EXITS source of truth both compilers build the retry expression from). The worker entrypoint MUST detect the wall from the failed agent run's own output and EXIT that code, and the constant MUST be held equal to the compiler's by the same cross-language test that guards 64/65/66. The detection marker set MUST be held against a corpus of wall wordings observed in the wild, read out of the entrypoint itself rather than restated in the test, and NO marker may depend on the word naming the quota (the token before 'limit') nor on any verb that follows it - it MUST also carry anchors that hold whatever the quota is called."
  rationale: "Issue #40: a worker that hits the model's session/usage limit failed generically, so the executor retried it - and a session wall is a rolling window that only the clock reopens, so every immediate retry hit the same still-closed door and burned the whole attempt budget to report FAILED ('it just keeps resetting'). 67 is terminal for the same reason 64-66 are (a blind retry cannot help) but its wall is uniquely temporary, so parking on it lets a re-drive AFTER the reset be the answer. Keeping it distinct from the degraded 64 is what lets the console read WHICH stop it was and a workflow be built around the session wall specifically. The detection markers are a best-effort bridge, not a contract (the model owns the wording, matched as StudioToolError matches a studio's refusal phrases); only a non-zero agent exit is inspected, so prose that merely names the words never trips it. Issue #47 is why the corpus clause exists: the first marker set demanded 'reached' or 'exceeded', a live wall printed \"You've hit your session limit - resets 7:20am (UTC)\", nothing matched, and the run retried four times into the same closed door - the exact failure #40 shipped to prevent, undetected because the tests asserted only that 67 existed and was emitted, never that any real wording reaches it. A best-effort bridge still needs a regression corpus, or it decays silently the next time the model rewords. The same miss then repeated from the other side: the set that replaced it keyed on the quota's NAME (session/usage/rate/N-hour), and a live wall printed \"You've reached your Fable 5 limit. /model to switch models.\" - a limit scoped to the model, whose name no closed list can anticipate because every release adds one. Hence the standing rule that the token before 'limit' is never load-bearing: the set must also anchor on frames that survive any name (a possessive '<verb> your ... limit') and on the clauses only a quota wall prints (a reset time, the offer to switch models). A model-scoped wall is still 67 rather than a new stop: the phase runs the model the compiler chose and cannot switch mid-flight, so the park is identical and the operator may re-drive on another model instead of waiting for the reset."
  test:
    scope: unit
    component: WorkflowCompiler
    type: contract
  criticality: high

INT-FC-R118:
  version: 1.0.0
  status: active
  statement: "The Console's platform-studio calls (the fleet read, the lifecycle toggles, and the repo scaffold write) MUST ride the studio's internal REST door, where a non-2xx answer raises a StudioToolError carrying the studio's own exception class from the typed {'error': ClassName} body, and MUST fall back to the MCP agent door only on a transport-level failure (the internal port not live), NEVER on a typed refusal."
  rationale: "The three-door table assigns app-to-app calls to REST on the internal Service port (INT-FC-R53): the agent Basic credential must not sign the cockpit's writes, and REST's typed statuses (AlreadyExistsError 409, SyncFailedError/PrFailedError 502) make the refusal class data instead of a phrase dug out of an MCP ToolError string (INT-FC-R116's bridge). The MCP fallback exists so the chart that publishes the port and this image can roll out in either order; restricting it to transport errors is what keeps a 409 from re-running a write on the agent door - a refused write retried through a second door is one write become two."
  test:
    scope: unit
    component: HttpStudioGateway
    type: invariant
  criticality: high

INT-FC-R119:
  version: 1.0.0
  status: active
  derived_from: [REQ-M6]
  statement: "The one-shot judge's ledger MUST be a pending set, not a log: exactly ONE row per (repo, ticket) - a new run for a ticket retires the row it supersedes - and a settled row MUST be retired after a bounded number of judge ticks. Judging MUST be isolated per row, so a read that raises on one drive leaves every other row judged on that same tick. A row's rendered line MUST be the engine's own word for the state it is in (waiting on checks, re-driving on findings, the outcome); only a row the engine has said nothing about yet reads as a run in flight."
  rationale: "The panel is the operator's whole view of what the engine did unattended, so every way it can lie matters. Two rows for one ticket made the ticket's own line read the SUPERSEDED outcome (the first match wins). An unbounded ledger accumulated every drive the process ever made, crowding the co-pilot out of the rail. A shared sweep meant one unreadable drive stranded every row behind it un-judged, and each stranded row rendered as 'running' - drives whose PR had been open for days still reading as work in flight. Bounding the receipt costs nothing durable: the merged PR, the parked one, and the ticket's runs on the executor all outlive it."
  test:
    scope: unit
    component: MaintenanceJudge
    type: invariant
  criticality: high

INT-FC-R120:
  version: 1.0.0
  status: active
  statement: "A console Sign of a record that exports (proposal, design) MUST hand the gate helper the phase tool's east-west base URL, each record pointed at its own tool, and MUST name the synthesized scratch root for the delivery so the helper's slug fallback resolves to the delivery's project. The records that register no exporter MUST be pointed at no tool."
  rationale: "Signing one of these gates IS the artifact-creation moment - the stamp freezes the tool's deliverables into the scratch BEFORE the signature lands - so a helper with no instance to read refuses the export, and with it the whole stamp. The helper's other ways to find one belong to a workstation running the skill by hand: ESTIMATEKIT_BASE_URL/PROTOPANE_BASE_URL in the environment, or design.md's own Prototype pointer, which names the public host - an OIDC browser door that answers a server-to-server request with a login page. The console holds what either would have to guess, since its own substance reads already ride that door. Unattested, this shipped unable to close a proposal gate at all: every Sign died on 'REFUSED: no estimation instance to export from', and the tests that existed could not see it - the design record took the tool-less Prototype: none path and the one export test drove a stub helper, so no test ever ran a real exporter. The slug rides along because the scratch is synthesized in a temp dir, so the helper's documented fallback to the repo folder name resolved to a random temp name; naming the root keeps that precedence (explicit slug, then the record's pointer, then the folder) intact instead of overriding what the record declares."
  test:
    scope: unit
    component: GitHubRepoStore
    type: invariant
  criticality: critical

INT-FC-R121:
  version: 1.0.0
  status: active
  statement: "Every Re-drive control MUST make the composer it opens visible from where it was pressed: the console pane is selected (so the composer is rendered at every width, not only where the workspace tab yields) and the composer is brought to the operator with the cursor in its feedback box."
  rationale: "Opening the composer is the ENTIRE visible effect of pressing Re-drive - the act itself is not submitted until the composer's own button - and the composer lives in the console card, which sits a screen below the line on exactly the pages that need it most (a degraded line, its run band unfolded) and is not rendered at all below lg while the workspace holds the pane tab. So the degraded banner's own call-to-action, the control the banner's prose sends the operator to, fired into a panel they could not see: no error, no progress, nothing - a button that reads as dead on the one line that cannot move without it."
  test:
    scope: e2e
    component: DeliveryDetailPage
    type: behavior
  criticality: high

INT-FC-R122:
  version: 1.0.0
  status: active
  derived_from: [REQ-M7]
  statement: "The fleet inbox MUST NOT carry its own copy of the queue's rules: the signals, their order, both folds, the issue stages and the exclusions MUST come from the playbook's vendored maintenance-inbox sweep, and this repo's fleet_inbox module MUST be an adapter that maps typed positions in and InboxItems out, attested against the same vendored fixture corpus the playbook derives from."
  rationale: "The skill promised that any frontend rendering the same queue derives it the same way, and nothing enforced it - so this console grew rules the corpus never stated (a running signal ranked above everything, both folds, the five-value stage vocabulary), and no test anywhere could catch its queue and a second reader's disagreeing about the same repo. Two hand-maintained encodings of one doctrine is the universal duplication violation, and the queue is exactly where it bites: the folds are what make one concern read as one row, so a drifted implementation shows a ticket beside the run already working it and sends the operator to re-drive live work. The adapter is the part that stays here, and running the fixture corpus THROUGH it is what proves the mapping is lossless - this repo's own new risk, which re-running the pure derivation alone would not touch."
  test:
    scope: unit
    component: FleetInbox
    type: invariant
  criticality: high

INT-FC-R123:
  version: 1.0.0
  status: active
  statement: "Both worker-prompt compilers - build_worker_launch (delivery) and compile_maintenance_workflow (maintenance) - MUST instruct every worker to write commit messages carrying NO co-author or AI-attribution trailer, on every phase, act and mode, since every one of them may commit."
  rationale: "The shared build workflow's commit-hygiene gate rejects any commit message with a co-author/AI-attribution trailer, and the release job `needs` that gate - so a single such commit reds the default branch and ships nothing. A worker pod clones the target repo and reads only that, never the operator's workspace rules, so the agent's own default trailer went unchallenged until CI refused it: four such commits landed across two repos in one morning, one of them blocking an otherwise correct fix. Recovery is fix-forward only (a pushed trailer cannot be rewritten out of history, just out-ranged by a later commit), which makes this a prevention rule rather than a cleanup one. Carried as prompt prose at each compiler's single choke point, the same shape and for the same reason as the interaction=auto directive (R77/R78), because that is the one surface every headless run reads."
  test:
    scope: unit
    component: WorkerLaunch
    type: invariant
  criticality: high

INT-FC-R124:
  version: 1.0.0
  status: active
  statement: "A run the Console stopped MUST be reported as a stop, not a failure: the Console MUST record WHO stopped it - `superseded` (a newer drive of the same delivery took over) or `operator` (Stop/Terminate pressed) - as a label on the Workflow, written in the SAME patch that requests the shutdown, and MUST derive the run's reported phase from that mark: `Stopping` while the run drains, `Stopped` once terminal, with a run that had already reached its own outcome keeping it. This is ONE derivation, applied identically to the run row and the node graph, and a `Stopped` run MUST count as terminal everywhere a terminal run does - the log-snapshot sweep above all. The relation `superseded` (this is not the newest run) MUST stay a separate, positional fact from the phase, never a substitute for it."
  rationale: "Argo has five workflow phases - Pending, Running, Succeeded, Failed, Error - and a shutdown lands in Failed, so the executor's own word cannot separate a crash from a deliberate close. Reporting it raw was a lie of attribution: a delivery iterated on across two weeks showed the operator eight consecutive red `Failed` rows in the run band, every one of them a run the CONSOLE had stopped on their own next drive, with nothing distinguishing them from a run that genuinely died. The node inspector one level down already said `Stopped` for the same event, so the band contradicted its own contents when unfolded. The mark is the Console's own protocol, the same shape and for the same reason as TERMINAL_STOP_NAMES: the Console asks for the shutdown, so reading the reason back is reading its own contract rather than interpreting a foreign signal - and unlike Argo's status message (identical for both reasons) it carries the one thing that actually differs, who acted. One patch rather than two because the shutdown is what turns the run Failed, so a separate labelling call would leave a window of bare unattributed failure that only opens when the second call fails. `Stopping` is a distinct phase because a graceful Stop lets the current step run out its exit handler and a worker's step runs to its whole deadline - reading `Running` there shows two live runs for one delivery, the exact confusion superseding exists to remove. Renaming the phase `Superseded` outright was rejected: superseded answers WHERE a run sits in the history, not HOW it ended, and collapsing the two would have destroyed the distinction between a run killed mid-flight and one that had failed - or succeeded - on its own long before the re-drive."
  test:
    scope: unit
    component: workflow runner
    type: invariant
  criticality: medium

INT-FC-R125:
  version: 1.0.0
  status: active
  statement: "Readiness MUST report not-ready until the lifespan's first refresh tick has COMPLETED - whatever that tick's outcome - and liveness MUST stay dependency-free."
  rationale: "/api/health returned a literal ok as soon as FastAPI was serving, and both probes pointed at it with a 5s readiness delay, so the Service routed traffic ~2 minutes before the first refresh had warmed the fleet cache. The fleet then read empty and the empty state named a configuration cause - 'set the git token in Settings' - for what was a warm-up window, sending an operator to edit a setting that was already correct (found verifying the v5.6.1 promotion). The gate is 'the first refresh finished', never 'the fleet is non-empty': an unconfigured install has an empty fleet correctly, and requiring a populated one would leave it never ready, never routed to, and so never able to show the very message that tells the operator to set the token - deadlocked on its own advice. Readiness therefore distinguishes haven't-tried-yet from tried, and the empty state only ever renders when it is true. Liveness keeps the trivial check on purpose: a liveness probe carrying the same dependency would turn a slow start into a crash loop."
  test:
    scope: integration
    component: RestDoor
    type: behavior
  criticality: high

INT-FC-R126:
  version: 1.0.0
  status: active
  statement: "The Console MUST hold the repo-host credential a `kind: repository` promotion target NAMES, as a registry keyed by that contract-declared name: registered from a supplied secret (never minted), carrying the pair's HOST from the first registration, listed without ever returning the value, and resolvable server-side to a value for a read and to a Secret REF for whoever performs the door. Registration MUST refuse a credential with no secret - a name resolving to nothing is the defect itself - while amending one already held MUST NOT require re-entering it. A pair credential MUST NOT be a git identity: its login MUST NEVER join the set the maintenance derivation reads as ours, and it MUST NOT be assignable to a phase."
  rationale: "The pair credential was named everywhere and held nowhere (issue #131): a repository target declares one, the pane refuses to declare a target without one, the scaffolded contract calls it 'a named secret the platform holds', and the promote skill resolved it 'with the operator or the platform's secret store' - which is the operator pasting a token, the one thing the design says never happens. This blocked BOTH brownfield instantiations, not just Managed: Hybrid is an onboarded app with a repository target, and that target's door is exactly this credential. What makes the registry unlike every other grant the platform performs is that a token for another organization's repository is not ours to create; it is granted to us, so this is registration, and refusing a secret-less one is what keeps the registry from reproducing the very state it exists to end. It is kept distinct from the git identities it stores alongside because they answer different questions: an identity resolves by ROLE and its login marks work as driven-by-us, while a pair credential resolves by the name the app's own contract writes down, belongs to the pair rather than to a run or a phase, is shared by every app reaching that pair, and is emphatically NOT ours - letting its login into the 'ours' set would count their organization's review as our own fresh pass. The host rides along from the first registration because another organization is precisely where a repo host other than GitHub arrives (#129), so the record says which host the door faces instead of the door assuming one."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R127:
  version: 1.0.0
  status: active
  statement: "A promotion target whose door cannot be performed MUST derive to `unreadable` carrying its own reason ('the door cannot be opened: <reason>') and a TYPED shut flag, and that judgement MUST outrank every other rule in the derivation - the version comparison and an open door alike. The pair MUST NOT be read at all when its door is shut, and a pair read MUST ride the credential that pair granted us or none: it MUST NEVER fall back to the Console's own token. Only a `kind: repository` target can be shut; an unasked question (no credential store to ask) MUST NOT be reported as a no."
  rationale: "Issue #131: 'a target with an unresolvable credential renders no differently from one with a working credential, because nothing tries'. Nothing tried, so a row could read `current` over a door no act could ever perform - the surface's worst failure, since promotion is the one line whose whole job is moving proof rather than hope. The shut judgement outranks the rest because every later input is an absence produced by that same one cause: reading the pair on OUR token (which reaches our org and was never granted to theirs) is what made the absence invisible, and reporting a version comparison over a door that cannot be performed names a promotion as the next act when no promotion is possible. It derives to `unreadable` rather than a sixth state on purpose: registration is a fact about our ability to ACT, not a position the target occupies - a pair whose credential we lost may be perfectly current, we simply cannot see it - so the five-state vocabulary the fixture corpus pins stays whole, and the typed flag plus the composed reason are what let a surface render the different act it asks for (register the credential, not look at the target). The reason is the SURFACE's to supply because the surfaces answer it differently and truthfully - the Console asks the platform's own registry, a desk asks whether its authenticated client reaches the pair at all - so what is shared, and what the corpus pins, is the state, the sentence, and the precedence."
  test:
    scope: unit
    component: PromotionDerivation
    type: invariant
  criticality: critical

INT-FC-R128:
  version: 1.0.0
  status: active
  statement: "A promotion MUST compile to a worker running the playbook's own promote skill, never to a console-side write and never to a desk act. A `kind: repository` door MUST carry the pair's credential as a Secret REF (never a value in the rendered manifest) alongside - never instead of - the promotion role's own git identity, plus the pair's `owner/name` as a plain env fact; an `environment` door MUST carry no pair anything. Compiling a repository door with no resolved pair credential MUST raise rather than produce a workflow. The workflow MUST be ONE step."
  rationale: "Issue #131 ended with the credential held and the surfaces honest about it, and still nothing that could open a door: a `terms: source` promotion pushes a TREE - the release's source to another organization's repository - which the console's own repo-host reads cannot do and must not learn to, and which the desk is forbidden from doing at all (INT-FOUNDRY-TERMINAL-055). The worker path already clones into an ephemeral workspace and takes secrets as env-from-Secret-ref, which is exactly the shape a granted credential needs: only the ref travels and the value is read inside the pod. The identity and the grant ride TOGETHER because they answer different questions - the commit is authored by us, the push is authorized by them - and a build that let one substitute for the other would either fail at auth or, far worse, succeed on a credential nobody declared. The pair's repository path is carried as a plain fact because it is load-bearing twice: the entrypoint scopes the credential helper to that exact path, and the completeness check reads their pull requests with it. ONE step because a promotion's acceptance may be a signal that answers days later on a network this cluster has no path into (REF-Promotion section 3), so there is nothing for a second step to wait on; where a target then stands is derived on read, as it always was."
  test:
    scope: unit
    component: PromotionCompiler
    type: contract
  criticality: high

INT-FC-R129:
  version: 1.0.0
  status: active
  statement: "Every promotion refusal the console can know without leaving it MUST be raised at compile, before a pod exists, and surfaced to the operator as a 422: an app with NO entry environment (it is Managed, and promotion never reaches it), a target the contract does not declare, a door whose credential the platform does not hold, and no release to carry. In the worker, the pair credential MUST reach git ONLY through a credential helper scoped to `https://<host>/<pair repo>` - never a URL, a remote, `url.insteadOf`, or a `.git-credentials` file - and a promotion run that opened no door MUST exit non-zero rather than read green, verifying a pair's door on the PAIR's credential and failing open on an unreachable API."
  rationale: "The Managed refusal is doctrine, not mechanics (#130): promotion moves what an entry environment PROVED, so an app with none is not a promotion subject - its pull request is its delivery or maintenance line's own output at the proven-in-CI bar, and a build that lets promotion reach it has broken the model rather than completed it. Raising it at compile is what makes it legible: the operator reads the tier and the reason, instead of a pod dying six seconds in on a proven check nobody can see. The helper scoping is the sharpest edge in this whole change. Host scoping reads as sufficient and is not: the common pair lives on github.com, which is our host too, so a host-scoped helper answers for our own org as well - and the day a partner's grant is the only credential git can find for github.com is the day something of ours is pushed on their token. Git matches a credential config URL carrying a path only when the request's path matches, which is exactly the narrowing wanted. The token reaches git over a pipe rather than through a URL because the clone's own x-access-token URL lands in .git/config, readable by anything that later runs in the tree including the agent: a contained risk for our credential in our clone, an uncontained one for a partner's grant in a tree we then push from. The completeness check extends the never-ships-nothing rule (INT-FC-R85's sibling) to the one line whose entire job is moving proof rather than hope - a headless single-turn agent that stopped before pushing leaves a run reading Succeeded over a promotion that never happened - and it asks on the pair's own credential because ours cannot see their pull requests and asking with ours would answer for a door that was never opened."
  test:
    scope: unit
    component: PromotionDrive
    type: invariant
  criticality: critical

INT-FC-R130:
  version: 1.0.0
  status: active
  statement: "An app's instantiation (complete | hybrid | managed) MUST be DERIVED from two facts read off the app's own repository - whether it has an entry environment, and whether its contract declares a `repository` target - and never stored or declared. An app with no entry environment is Managed whatever its contract says. Only a MANAGED app has a home the lines run over; a Hybrid app declaring the same target has none. A console that cannot read the app MUST answer `complete`, the tier that grants the least."
  rationale: "REF-Delivery section 1's correction that closed the Managed design is that the instantiation is derived, never declared, and the adopt skill's step 3 asks a hand to say it out loud so nobody re-derives it - which is exactly the thing code should do instead. A stored tier is a claim that goes stale the moment an app is onboarded or a target declared, and every bar downstream hangs off it: what 'done' MEANS for this app (proven-live-and-promoted versus proven-in-CI-and-merged) and whether promotion reaches it at all. The Hybrid exclusion is the sharp edge and the one a naive reading gets wrong: Hybrid declares the SAME `kind: repository` target, and its work is built and proven HERE then promoted there - so treating the target's presence as 'this app's home' would route an ordinary Hybrid ticket's fix into another organization's review queue instead of onto our own repo. The unreadable case answers `complete` because that tier grants the least: no door back, no foreign home, so a failed read can never be the reason an act reaches outside our org."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R131:
  version: 1.0.0
  status: active
  statement: "A maintenance act over a MANAGED app MUST span two repositories and keep them distinct: the ticket stays on the foundry-side repo (FC_REPO) and is read with OUR credential, while the code is cloned from the home (FC_PAIR_REPO on FC_HOME_BRANCH) and the pull request is opened and verified there on THEIR credential. The home clone MUST be keyed on FC_HOME_BRANCH, never on FC_PAIR_REPO alone, and MUST carry no token in its URL. The worker MUST be TOLD both coordinates in its prompt, together with the rules that follow from not owning the place: the merge is theirs, and the foundry's conformance is never scaffolded into their repository."
  rationale: "Issue #130: 'every line assumes our own org today - our credentials, .delivery/ on the default branch, issues on the repo itself, our CI. Point any line at a foreign repo and it stops.' The two coordinates answer different questions and conflating them fails in the two worst ways available: an act that works the wrong tree, or one that files the fix where nobody is looking - both of which produce a run that looks green from every angle except the one that counts. Keying the clone on FC_HOME_BRANCH rather than on FC_PAIR_REPO is load-bearing because a PROMOTION door also carries FC_PAIR_REPO and must clone ours (the pair is where it pushes TO, not from); keying on the pair repo would send every promotion worker into the partner's tree to promote from. The prompt must state both coordinates because the agent wakes in a clone of THEIR repository holding OUR ticket number, a shape no skill can infer from the tree around it - left to itself it would look for the ticket where it is standing and open its pull request against whatever remote it found. The completeness check follows the pull request to the home on the pair's credential for the same reason the promotion door does: ours cannot see their pull requests, so asking with ours would report a green run over a PR that was never opened."
  test:
    scope: unit
    component: MaintenanceCompiler
    type: invariant
  criticality: critical

INT-FC-R132:
  version: 2.0.0
  status: active
  statement: "A MANAGED app MUST NOT admit any act that merges: the console's merge press MUST be refused, naming the home and the reason, and a one-shot drive MUST run its whole loop - resolve, fresh-eyes review, re-drive on a recorded FAIL while the attempt budget holds (INT-FC-R75) - and END at the home pull request carrying a recorded PASS on green checks, reported as theirs to merge, never merging it and never silently downgraded to another ceremony. The judge MUST find that pull request through the ONE pointer recorded on our ticket and read it on the pair's credential (INT-FC-R135), never by listing the home's pull requests or consulting our own, and a re-drive MUST carry the home so the revising worker clones their repository beside our ticket (INT-FC-R131). A drive MUST also be refused when the platform holds no credential for that home, before any pod is compiled. The pane MUST offer one-shot for a Managed app on the same terms."
  rationale: "The merge is the other organization's act, and that is the whole of what a home withholds: the iteration is the valuable part of one-shot - the engine re-driving the resolve on the reviewer's findings until a PASS - and it depends on nothing the foundry does not own. The delivery line already runs this way over a Managed app (INT-FC-R136: the review is recorded and the gate stays pending for their merge), so maintenance mirrors it rather than refusing the ceremony outright, which threw the loop away to protect the one step it cannot take. The honesty the refusal protected is kept where it matters: the ledger row and the parked fact say 'theirs to merge' in as many words, so an operator never believes the ticket landed itself. The merge press is refused by the MODEL rather than left to fail on permissions, because a permissions failure is an accident of what a grant happens to allow - it would come back the day a pair widened theirs, and the console would then merge into someone else's repository because nothing said not to. Reading the home PR through the pointer keeps a Managed drive to one PR's reads on the pair, the rule the view already follows. The missing-credential refusal is the maintenance twin of the promotion door's: an act that cannot clone their repository or open a pull request on it produces work nobody can land, and spending a pod to discover what the console already knows helps no one."
  test:
    scope: unit
    component: OrchestratorService
    type: invariant
  criticality: high

INT-FC-R133:
  version: 1.0.0
  status: active
  statement: "The Console MUST run the playbook's promote fixture corpus - every case, over its OWN derivation - and the corpus MUST be vendored and pinned like every other shared corpus, as FIXTURES ONLY with no implementation file from that skill. A case named in the required set that the vendored corpus no longer carries MUST fail."
  rationale: "The promote skill states the rule this exists to keep: a surface that re-derives promotion state runs every case, so a rule read differently there than here fails a test rather than shipping two views that disagree about the same target. The desk has run the corpus since its dock was built; this console re-derived the same positions in Python and ran NONE of it, so for one of the two runtimes the mechanism holding both to one doctrine was a comment. That is the same violation INT-FC-R122 records for the inbox queue, at the surface where it bites hardest: promotion state is what tells an operator whether a release has moved, and two readers disagreeing about one target is precisely how a promotion gets driven twice or not at all. Fixtures-only is a contract, not an omission: no implementation is shareable between a Python derivation and a TypeScript one, and the day a .py is vendored from this skill is the day one of those derivations quietly became the other's dependency. The required-name set is asserted rather than a count because a count is what lets a refresh silently drop the case carrying most of the contract while the suite still reports green."
  test:
    scope: unit
    component: PromotionDerivation
    type: invariant
  criticality: high

INT-FC-R134:
  version: 1.0.0
  status: active
  statement: "The promotion view MUST answer whether an app is a promotion SUBJECT before any target is looked at, and MUST derive no positions for one that is not: an app with no entry environment (it is Managed - its repository target is its home, not a door), and an app that has proven no release while declaring targets. Both MUST be reported with their reason rather than as empty rows, and kept distinct from a contract declaring no targets. A non-subject's targets MUST NOT be read from the repo host at all."
  rationale: "Issue #130's doctrine is that promotion never reaches a Managed app - and the adopt skill declares a Managed app's HOME in its promotion contract, so the pane parsed a repository target and derived its position: proven '' (a foundry-side repo has no semver tags), accepted '' (no promote/* door was ever merged), and derive_position read the empty comparison as PENDING. The pane then showed the home as a pending promotion with a Promote act on it, which the drive would refuse. Not dangerous, and exactly the lie the shut-door work exists to prevent: a surface naming a promotion as the next act on an app promotion never reaches. Tracing it exposed the general case - any app that declared a target before its first release read PENDING too, a door 'behind' a release that does not exist. Both are facts about the APP, which is why they are answered at the view and not in the per-target derivation: 'nothing to promote' is zero positions, and a sixth target state meaning that would be a rule the corpus's one-target-in, one-position-out shape cannot carry. The home is not read because a Managed app's repository target is an address its lines land through, not a door promotion derives - reading it would spend a pair-credential read to derive a row that must not exist."
  test:
    scope: unit
    component: PromotionView
    type: invariant
  criticality: high

INT-FC-R135:
  version: 1.0.0
  status: active
  statement: "A MANAGED app's maintenance view MUST read its tickets from the foundry-side repo and each ticket's pull request from the HOME by following ONE recorded pointer - a marked comment on our ticket (`<!-- foundry:home-pr <url> -->`) naming the home PR - read on the pair's credential with its reviews and checks folded in; it MUST NEVER list the home's pull requests and MUST NOT consult our own PR list. A Managed app MUST derive NO release train whatever the repo host answers. A pointer that cannot be read MUST leave the ticket awaiting a PR, never resolved. The worker's entrypoint MUST record that pointer idempotently the moment it has verified the home PR exists, and a resolve re-drive MUST follow the same pointer for its reviewer's findings. The state MUST withhold one-shot and name the home, so the pane offers what the drive admits."
  rationale: "foundry-platform#136: the Managed ACT landed its pull request on the home while the VIEW kept reading our repo, so a resolved Managed ticket rendered as 'open, no PR' forever - the loop stage never advanced, the Inbox kept offering a resolve for work already in review, and an operator would re-drive live work. The pointer is the design that keeps our repo the record: a ticket-to-PR link re-derived cross-repo from a branch convention we do not control on their side is a link that silently breaks the day their conventions differ, while a recorded one is a fact; following one pointer costs the pair one PR's reads however many they have, and never scans a repository we do not own. It is the entrypoint that records it because the entrypoint is what just proved the PR exists - an agent asked to remember is a pointer that is sometimes missing - and idempotence is what lets a re-drive leave one record rather than a trail. No release train because we release nothing and their versioning is theirs in whatever scheme: the train asks only first-person questions (what have WE tagged, what would OUR pipeline cut, what does OUR entry environment serve), and pointing it at their repo would make the inbox tell the operator to release something nobody here can. An unreadable pointer reads as awaiting, never done, for the same reason an unchecked probe is not proven. One-shot is withheld at the state so the offer and the refusal (INT-FC-R132) are one rule rather than a button that refuses on press."
  test:
    scope: unit
    component: OrchestratorService
    type: invariant
  criticality: critical

INT-FC-R136:
  version: 1.0.0
  status: active
  statement: "A delivery over a MANAGED app MUST keep the line's scratch on the foundry-side repo exactly as every other line does (`/work/repo`, `.delivery/` mounted inside it on its `delivery/<line-id>` ref) and MUST clone the home BESIDE it (`/work/home`, exported as FC_HOME_DIR) on the pair's credential, for every phase. The delivery worker's layout MUST be distinguished from the maintenance worker's by the scratch facts a delivery carries (FC_RECORD / FC_SCRATCH_REF), never by the pair repo alone. Every phase's worker MUST be told that the scratch and the code have parted company, where each lives, and that ship is a pull request on the home at the proven-in-their-CI bar. One-shot MUST NOT stamp a Managed app's delivery gate over its review; the review is recorded and `signed:` stays pending for the operator to stamp when the home merges. The drive MUST be refused before a pod exists when the home's credential is not held."
  rationale: "foundry-platform#135, and the correction that reframed it: the scratch never moves and nothing about it is a decision - it is an orphan ref of OUR repo, mounted at the root of OUR checkout, pushed to git, and a Managed app's foundry-side repo exists precisely so the scratch and the tickets have a home on our side. What Managed changes is only that the repo holding the scratch is no longer the repo holding the code, and a delivery worker assumed one clone did both. Two clones side by side is the whole of the fix; the single-clone assumption was what would have put our records inside their tree - the 'never scaffold the foundry into their repository' rule broken by plumbing rather than by intent. The layout keys on the scratch facts rather than the pair repo because the maintenance act over the same home legitimately clones THEIR repository into /work/repo (it carries no scratch), and a promotion door carries the pair repo too and must clone ours; three workers, three layouts, one discriminator each. The prompt states both coordinates because no skill can infer from a tree that the records go one way and the code another. One-shot does not stamp the delivery gate because that gate IS the home's merge - the app runs on no foundry, so nothing here can prove it live, and the engine's standing pre-authorization covers gates it can honestly close over a review; calling a line delivered whose change nobody has accepted is exactly the silently-raised bar REF-Delivery section 1 forbids."
  test:
    scope: unit
    component: WorkflowCompiler
    type: invariant
  criticality: high

INT-FC-R137:
  version: 1.0.0
  status: active
  statement: "Stating a fact on the event bus MUST NOT change the act that caused it. With the event transport unreachable, every act that would publish (start, drive, sign, re-open, close, a maintenance drive, merge or close, the judge's merge or park, and the refresh tick's narration of moved positions and terminal runs) MUST complete with the same outcome, the same response, and the same derived state as it does with the transport up, and each dropped publish MUST be logged at warning. A publish MUST NOT be retried inside the caller's latency budget, queued into unbounded memory, or surfaced to the caller as an error, and no readiness probe, health check, or startup path may depend on the transport. Every published event MUST be a CloudEvent whose type is one row of the Console's own events page under a domain the Console owns (delivery, maintenance), never composed at a call site, carrying identity and pointers and never a record body. The refresh tick MUST prime what it sees on a cold start and narrate nothing it merely found, and no read path of the Console may consume the Console's own events."
  rationale: "REF-Events section 6 states the one-way rule as the test every producer attests, and ADR-038 is this Console's own precedent for it: the layer that exists to watch the system never becomes load-bearing inside it. The acts that publish here are the ones the platform can least afford to fail on a broker's account - a gate signature, a line close, a merge the judge fires on a recorded PASS - so the guarantee is enforced at the one call site (state_fact) rather than assumed of the adapter: a publisher is contractually forbidden from raising, but a caller trusting that contract and being wrong would fail an act it had already committed. The cold-start rule exists because the tick derives everything from GitHub and the executor (P2): a restart sees every line and every run that ever was, and narrating that as a burst of facts would tell a routine that a week of history just happened. The no-consume rule is the ticket's own (#63): an event says something happened and is never read back as truth; the first consumer that treats the stream as the store is the bug. The page equality is REF-Events section 3: each owner states its own types where its tests can hold them, so the consumer's contract and the adapter's vocabulary cannot drift apart."
  test:
    scope: unit
    component: OrchestratorService
    type: invariant
  criticality: high

INT-FC-R138:
  version: 2.0.0
  status: active
  statement: "Every step the Console launches MUST be handed to a named playbook catalog agent, bound by the Console itself beside the step's skill: each delivery phase its own phase worker, each maintenance act its agent (the Programmer resolves and reconciles docs, the Reviewer reviews), and the promotion door the Release Manager. A delivery gate's fresh-eyes review is the phase's own (the adversarial-review skill, run inside the phase worker), so the Console binds no reviewer to a delivery step and its workers carry no FC_REVIEWER. The compiled Workflow MUST carry that name on the worker's template (FC_AGENT and the foundry-console/agent label), and the five phase workers and the Reviewer MUST be distinct agents."
  rationale: "Every phase ran a worker pod, and every worker was anonymous: the run log said a phase ran, it could not say who ran it (issue #62). The playbook holds one agent definition per distinct worker (REF-Universe section 4), so the binding is the Console's, in the same place and on the same terms as the phase->skill map - the corpus names the people, the Console names who it hands each step to, and the corpus never learns the Console exists. The name is carried on the template itself so a run can say who ran a step off its own record, even when the studio that holds the roster is down."
  test:
    scope: unit
    component: WorkflowCompiler
    type: contract
  criticality: high

INT-FC-R139:
  version: 1.0.0
  status: active
  statement: "A bound agent's posture and character MUST be read from the playbook's catalog at launch, never invented by the compiler: the catalog's permission mode and writes flag ride to the worker as information it honours (writes: false as the runtime's editing-tool denylist), and the agent's own paragraph rides as the system prompt the worker runs under, verbatim. The catalog MUST be read once per drive over the playbook studio's door, and a catalog that is unreachable or empty MUST degrade the drive to the named but anonymous worker of before - every other compiled field byte-identical - recorded at warning in the orchestrator's log, never a refused run."
  rationale: "The catalog is the corpus's half of the split and the Console's half is the binding; a compiler that restated an agent's posture or character would be the parallel-maintained copy the corpus forbids, going stale the moment the roster moved. Reading it live over the same door the workers pull their skills from keeps that split exact and adds no new dependency. It is never load-bearing for the same reason the phase->skill map does not check the skill exists before launching: a run that could not start for want of a roster would fail an operator on the studio's account, when the worker of before ran perfectly well without one."
  test:
    scope: unit
    component: WorkflowCompiler
    type: behavior
  criticality: high

INT-FC-R140:
  version: 1.0.0
  status: active
  statement: "The git identity a worker commits as MUST be keyed on the catalog agent the step is bound to, not on the step: the role -> identity map's assignable roles are the catalog agents the Console hands steps to plus the console's own acts, the Settings grid lists them by agent with the steps each runs, and the identity assigned to an agent reaches every step that agent runs (the Programmer's to resolve and reconcile-docs alike). A step key from before the catalog MUST be dropped by the map like any unknown key, never aliased."
  rationale: "ADR-0001 assigned a machine-user per phase positionally, which is what made the grid read as seven slots rather than as who holds which account. Keying on the agent is what makes the assignment legible: the Reviewer holding a different account than the Programmer is the whole reason a driven review can approve a driven PR, and it is now stated as a fact about two people. The old step keys are not aliased because the map is small and the corpus's own rule holds (no permanent code for a transient migration): the operator re-assigns once after the deploy, and an alias would be a second vocabulary kept forever for a morning's work."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R141:
  version: 2.0.0
  status: active
  statement: "A finished or running run MUST say who ran each step: the run row carries the agents its workers were compiled for in step order, each node of the run graph carries the agent its template ran as (none for a step group or a gate suspend), both read back off the Workflow object's own template labels rather than a second store, and the worker's pod log announces the agent it runs as. A run compiled before the catalog existed MUST report no agents rather than a guess."
  rationale: "The issue's done-bar is that a reader of a finished delivery knows who did the work, and the Workflow object is already the run's record (decision 0002: run logs self-contained), so the agent is stamped where the run's other facts live and read back from there - no table to keep in step with the executor, and it outlives the pod. The pod log names the agent for the same reason the run row does: a log that said a phase ran but not who ran it was the exact anonymity the ticket named."
  test:
    scope: unit
    component: RunHistory
    type: contract
  criticality: medium

INT-FC-R142:
  version: 1.0.0
  status: active
  statement: "A git identity's PAT MUST be exercised against the repo host before it is seated, not merely stored: an explicit refusal (a 401/403) and a token that authenticates as an account other than the declared login MUST both reject the save so the credential never reaches the Secret, while a transport failure, a timeout, or no check wired MUST fail open and seat it. The refusal MUST name what was seen, and a save carrying no token (an edit of the name, email, or login alone) MUST NOT call the host at all."
  rationale: "INT-FC-R114 closed exactly this hole for the MODEL credential after issue #30, and left it open for the git one: an identity was checked only for presence - is a Secret seated? - so the pane showed a green tick over a revoked or mis-pasted PAT and the first real sign of trouble was a worker dying on an authenticated clone, mid-delivery, with GitHub's 'Invalid username or token' as the only evidence. The login comparison is the half a presence check can never do: two identities exist precisely so Review is a different GitHub account than Delivery (GitHub refuses to let an account approve its own PR), so a PAT pasted from the wrong account collapses that separation while every surface still reads green. Fail-open on a transport error keeps a flaky network from turning a save into a false refusal - only an explicit answer from the host may block one - and an empty token is not worth a call because it means the operator is editing the identity's name or email and the stored PAT is being kept."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R143:
  version: 1.0.0
  status: active
  statement: "The console's own git token MUST be resolved once and held, not re-derived on every outbound read: the composition root holds the resolution behind a plain provider callable, every Settings write that can change which identity the console runs as (saving an identity, deleting one, reassigning the git roles) MUST invalidate the hold so a rotation or revocation still takes effect with no redeploy, and a TTL MUST bound a change made around the Console rather than through it. A resolution that comes back EMPTY MUST NOT be held, and MUST NOT evict a held value - it is retried on the next read."
  rationale: "The token was read live per call so a Settings change needed no redeploy, and the adapters resolve it before every single GitHub request. Against the K8s store one resolution is a four-hop walk - which identity holds the console role, its fields, its Secret's existence, its value - so a 40-repo inbox sweep spawned ~2600 kubectl processes to re-answer a question only the operator can change (measured: 520 GitHub reads, 520 resolutions, 5 processes each). The cost was the smaller half of the harm. Each hop degrades to \"\" on a failed read, so any one flaky kubectl made a configured console resolve as UNCONFIGURED, and the org scan that read no token returned an empty fleet - the wipe behind issue #64's empty board, arriving with copy that blamed the operator's token. Holding the resolution takes the same sweep to 5 processes and removes ~520 chances per sweep for a transient read to unconfigure a working console; invalidating on write keeps the late binding that made per-call resolution attractive in the first place. Never holding an empty resolution keeps a console that starts before its identity is assigned asking rather than caching the absence, and never letting an empty resolution evict a held one encodes the same distinction INT-FC-R144 draws for the scan: a token does not spontaneously become empty, so an empty read is a failed read."
  test:
    scope: unit
    component: HeldCredential
    type: behavior
  criticality: high

INT-FC-R144:
  version: 1.0.0
  status: active
  statement: "A warm cache MUST NOT be replaced by a scan that could not be MADE. The org-wide reads the Fleet board and the delivery index are rebuilt from MUST raise (SourceUnavailable) rather than degrade to an empty list - a missing credential and an unreachable host alike - and a refresh tick that catches one MUST hold the last-known board and index rather than publish the emptiness it inferred. A held board MUST declare itself: the fleet read carries when it went stale and why, the masthead reports it as held, the forced rescan MUST NOT report a held result as a landed refresh, and the empty state MUST NOT blame the operator's git token for a scan that never ran."
  rationale: "The board blanked semi-randomly and healed itself two minutes later. list_org_repos answered [] for both 'the org has no repos' and 'I could not ask', _compute_fleet caught anything left and answered [] again, and refresh() then assigned that over the good cache unconditionally - so one flaky read (usually the per-call token resolution of INT-FC-R143) emptied the whole floor until the next tick. Every layer was individually reasonable: degrading a read to empty is right nearly everywhere in this codebase, because one repo that will not answer should not fail a page. It is wrong at exactly the point where a cache is REPLACED from the result, because there the two meanings of empty become a published claim about the floor. The staleness is not decoration: a held board and a current one carry identical projects, so without it the fix trades a board that lies by vanishing for one that lies by standing still. And the forced rescan needed the same fact - its guard against a blanking refresh tested `!poll.projects`, which an empty array passes, so the one outcome it was written to prevent flashed a ✓."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R145:
  version: 1.1.0
  status: active
  statement: "A transient GitHub READ failure (5xx, network failure, or an explicit rate limit whose wait fits the request deadline) MUST receive bounded retries before it is reported. Permanent authentication or permission refusals MUST NOT be retried. Exhausted attempts and deferred reads MUST surface as SourceUnavailable rather than a raw transport error. A named wait longer than a request can hold MUST be reported rather than served. A status the host means as an ANSWER (404, 409, 422) MUST reach the caller unchanged, and a WRITE MUST NOT be retried. An act that ends in SourceUnavailable MUST answer 503 with Retry-After, never 500."
  rationale: "A re-drive of a live delivery answered 500 in the action strip, with the fleet board held beside it and a valid PAT behind both. GitHub had met the scan's burst with 403 - one matching-refs call per repo across the whole org, eight wide, every tick - and the act's own reads landed in the same second. INT-FC-R144 had already taught the SCAN to survive this, so the read path degraded exactly as built; the act path had no such layer and never had one. Two things made it a crash rather than a message: nothing between urlopen and the route knew that a status the host itself describes as retryable, naming the wait in Retry-After, is worth asking again; and urllib.error.HTTPError is an OSError, so it matched neither the route's except ValueError nor the (ValueError, RuntimeError) its siblings catch. Retrying at the transport is what keeps the blip from reaching any caller, which is why this claim sits under the reads rather than beside the routes - a per-route rescue would have to be written again for every act that reads before it writes. The write exclusion is not caution: a retried write whose response was lost commits twice, and a commit, a ref, and a merge carry no request key that would make the repeat safe. The wait ceiling separates the two conditions that share 403: a secondary limit clears in seconds, while an exhausted hourly budget names the remainder of the hour, and sleeping that inside a request is a hang wearing a retry's clothes."
  test:
    scope: unit
    component: GitHubTransport
    type: behavior
  criticality: high

INT-FC-R146:
  version: 1.1.0
  status: active
  statement: "The worker entrypoint's LOGIC - the deliberate-park branch that reads a missing record after a clean agent exit as terminal rather than transient, the record `status:` parse that maps aborted/in-progress onto opposite exits, the gate's lookup and verification of the phase's committed fresh-eyes review and the stamp only a PASS reaches, each park sentinel's requirement that the ticket also carry its durable label, and the maintenance completeness check that refuses to report green over an unopened PR - MUST be attested by EXECUTING devops/worker-entrypoint.sh against a fixture (a fake model turn, a fake repo host, a local git remote, a temp tree) and asserting its exit code and side effects. Source-text assertions MUST NOT be the only guard on a branch; they remain the right guard for the constant tables held equal across the shell, the compiler, and the pane."
  rationale: "Every delivery phase and every maintenance act runs through this one script, and its only guards were source-text reads: three modules matched strings, and the closest test retyped a one-line grep into a temp script and ran the copy, pinned to the original by a string assertion - a guard that scales to an expression and not to a branch, when the branches are where each wrong side parks or retries a real line. The file's incident record (four attempts burned against an unsigned upstream gate, a passing gate read as failed for markdown emphasis, a resolve that shipped nothing reading Succeeded) lived in prose, so nothing failed if a refactor reintroduced one. Executing the real file is also what makes it safe to restructure, which #71's harness-contract carve needs before it can be attempted. FC_WORK_DIR is the seam that makes execution possible, defaulted to /work so a pod reads the same paths. Authored on PR #74 by the maintenance loop's own resolve of #73; grafted onto the direct resolve that landed first."
  test:
    scope: integration
    component: worker-entrypoint
    type: behavior
  criticality: high

INT-FC-R148:
  version: 1.0.0
  status: active
  statement: "Establish MUST accept an optional source archive (an existing application as a zip, base64 in the request body) and land the archive's screened contents under _recast/ on the line's orphan delivery/<line-id> scratch ref, in the register commit, and NEVER on the default branch - the scratch is a ref no workflow triggers on, so the legacy tree meets none of the app contract's gates, and close tags then removes it, so the source is frozen and reachable by construction. The repository MUST still be born the ordinary way (templated by platform-studio when it can be, adopted when it exists, bare when neither), so main carries the app contract from the first commit exactly as a greenfield does; a seeded repo MUST NOT be exempt from templating. The archive MUST be screened before anything is created: vendored and built trees (.git, node_modules, dist, build, the caches) skipped, a single wrapping folder stripped, env files other than examples REFUSED by name, any file carrying a secret-shaped string REFUSED by name, and a path escaping the tree, an empty archive, or one over the size cap REFUSED. A repository that already exists MUST be adopted and recast, not refused; a source over a repository that already carries a live delivery/* line MUST be refused. The birth MUST record the recast beside how the repository was born."
  rationale: "A recast line starts from a working, usually vibecoded, application rather than from an ask, and the console already scopes an existing repository off its contents: the missing convenience was getting the app INTO a repository without a hand push. Seeding the default branch keeps the source in the app's own history as provenance, which is what the build's repo strategy (rebuild, carrying the frontend) reads. The screening is the whole reason this is not a plain upload: an app exported from a prototyping tool routinely carries its keys in tree, and a commit onto a foundry repo is history for good, so a refusal that names the files costs one clean-up and a silent commit costs a rotated key. Refusing an existing repository keeps the act to what it says: a seed, never an overwrite. The studio is not asked because its templated contract would collide with the archive's own files at the root; born-bare already carries the contract to build time and is recorded as such."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: medium

INT-FC-R149:
  version: 1.1.0
  status: active
  statement: "A delivery's SEED - what the line grows from: new, follow-on, or recast - MUST be derived from two facts on the repo and never declared: a delivered/<slug>/P<n> tag reads follow-on (and wins, whatever else the repo holds), a seed/<slug> tag reads recast, neither reads new. The archive seed MUST mint that seed/<slug> tag on the scratch's register commit - the commit that carries _recast/ - annotated with the register message, so the tag outlives the scratch ref close removes and keeps the source reachable. The source MUST read the two tag namespaces only for a repo that carries a live line, and a namespace it cannot read MUST raise typed SourceUnavailable, never infer new; retained projections keep their last successful observation with stale coverage. The state DTO MUST carry the seed, and the cockpit MUST show it beside the status wherever a delivery's status is shown."
  rationale: "The two axes a line is read on are both derived: the instantiation from the entry environment and the contract's door (INT-FC-R130), the seed from the repo's tags. A follow-on already had its fact (the delivered tag the close mints and the scope door reads); a recast had none once the establish event scrolled by, and a badge read off an event log would be a second store of a fact the repo could carry itself. The seed commit's tag is that fact: one write at seed time, one matching-refs read per line, and the app's provenance stays readable from a fresh clone for good, the way delivered phases do. Reading only repos that carry a line keeps the org scan's cost where INT-FC-R144 put it, and reporting source unavailability on an unreadable namespace keeps the badge honest and refuses fresh commands without authoritative evidence. A hand-pushed app carries no seed tag and reads new until the archive path or a hand-minted tag says otherwise, because nothing on the repo says otherwise."
  test:
    scope: unit
    component: GitHubDeliverySource
    type: behavior
  criticality: low

INT-FC-R150:
  version: 1.0.0
  status: active
  statement: "At a gate the worker entrypoint MUST spawn no review of its own: the gate's evidence is the phase's own fresh-eyes review, located mechanically as the newest `.delivery/reviews/<record-stem>-*.md` by version order, and the entrypoint's part is that lookup, the verdict read, and the stamp. A record that reaches its gate with no review artifact, or whose newest artifact does not end VERDICT: PASS, MUST exit non-zero after pushing the scratch as it stands - the committed FAIL is the retried phase's prior - so the executor retries the phase fresh; and no runner-authored review prompt MUST exist in the entrypoint."
  rationale: "The entrypoint's gate review predated the playbook's adversarial-review skill by six days (2026-07-10 against 2026-07-16) and was never pointed at it: a three-check prompt in the console's own wording, a hand-restated subset of the skill's lenses (the playbook's universal violation #1, REF-Delivery anti-pattern 40). It re-reviewed bytes the phase's own final PASS had just covered, overwrote a phase review of the same name on PASS, and on FAIL discarded its findings and exited, so the retried phase started cold with no idea what failed - the loop an operator journaled as 'running on diminishing returns' (moments-app, delivery/2026-08-25). The console's own rule is that it binds catalog agents and runs the playbook's helpers unported, never restating either; a review is judgement and belongs to the skill inside the phase, and the console's honest part at a gate is mechanical: locate, read, stamp."
  test:
    scope: integration
    component: worker-entrypoint
    type: behavior
  criticality: high

INT-FC-R151:
  version: 1.1.0
  status: active
  statement: "A gate stamp for a phase whose gate freezes a studio's deliverables (EXPORT_STUDIO: the proposal from estimatekit, the design from protopane) MUST reach that studio through its east-west base URL and name the project that studio holds as the export's project key: the compiler hands the worker FC_TOOL_URL (the studio port's tool_url, the same door the cockpit's Sign hands the stamper) and FC_SLUG (the key that studio holds the delivery's project under, by its own naming rule: estimatekit the delivery slug verbatim, protopane its lower-cased form with each run of other characters a hyphen), the same key the worker's prompt names for that studio and the cockpit reads it by, and the entrypoint passes them as --tool-url and --tool-slug on every stamp it runs. A phase whose gate freezes nothing MUST carry an empty FC_TOOL_URL and stamp export-free, and a tooled gate whose worker carries no FC_TOOL_URL MUST end refused rather than signed over an unfrozen export."
  rationale: "The first one-shot line after the vendored stamper caught up with the playbook (hello-spa, run r-60b026c0, 2026-09-06) reached its proposal gate with a passing review and was refused at the stamp: 'no estimation instance to export from'. The public studio host is a browser door behind OIDC, so the pod cannot be pointed at it; the console already knew the answer, because Sign hands the stamper the studio's in-cluster URL, but the worker was never told. The slug rides beside the URL because the pod's checkout is /work/repo and the stamper's default slug is the folder name, which no studio holds a project under. Keeping the record-to-studio map in the domain is what stops Sign and the worker from disagreeing about which gate freezes what."
  test:
    scope: integration
    component: worker-entrypoint
    type: behavior
  criticality: high

INT-FC-R152:
  version: 1.0.0
  status: active
  statement: "The MCP configuration the worker writes for the agent, carrying the studios' Authorization headers, MUST live outside the clone (beside it under WORK_DIR, handed to the agent by explicit --mcp-config path) and never at the clone root as `.mcp.json`, so no `git add` in the working tree can stage a credential and the CLI's committable project-config filename is not repurposed for a secret."
  rationale: "The access-psaeng line (2026-08-31) found /work/repo/.mcp.json carrying live Basic headers in the untracked workspace root (playbook#189). The org's secrets scan would refuse a staged copy before any release, but the file should never be stageable at all, and the fix belongs at the writer: an ignore rule in every app repo would cover only scaffolded repos and fight the CLI's convention that `.mcp.json` at a repo root is project config a team commits on purpose. The CLI loads --mcp-config from any JSON file, and the project-root auto-load it loses was a duplicate of the flag."
  test:
    scope: unit
    component: worker-entrypoint
    type: invariant
  criticality: high

INT-FC-R153:
  version: 1.1.0
  status: active
  statement: "A delivery whose repo is named demo-<x> MUST read as SEED demo when the org holds <x> carrying a delivery/* head or a delivered/* tag, and the source MUST carry <x>'s full name beside the seed as demo_of; a demo-<x> whose <x> is no line MUST read by its own tags as any repo, and a source that cannot be read MUST raise typed SourceUnavailable for the observation, never infer new; retained projections keep their last successful observation with stale coverage. A demo MUST win over the repo's own tags. The state DTO MUST carry demo_of and the cockpit MUST show the demo seed beside the status, naming its source."
  rationale: "REF-Demo makes the demo the fourth seed, derived like the other three: a prefix on the name is a declaration until the org confirms the source is a line, and only that read makes the line a demo. An unreadable source answering 'not a demo' would silently turn a rehearsal into an ordinary line that authors from the request on stage, so it reports source unavailability instead, preserving the last successful projection as stale while fresh commands refuse, the same evidence boundary INT-FC-R149 gives an unreadable tag namespace. A demo outranks its own tags because a retired demo whose repo lingers with a delivered tag is still a rehearsal when run again, never a customer follow-on."
  test:
    scope: unit
    component: GitHubDeliverySource
    type: invariant
  criticality: high

INT-FC-R154:
  version: 1.0.0
  status: active
  statement: "Every worker of a demo line MUST be told it is one: the compiled prompt of every phase MUST carry the demo directive naming the source repository, the source app's fleet name, this line's key and its app's fleet name, and the copy-never-author rule, and the pod MUST carry FC_DEMO_OF; a line that is no demo MUST carry neither. Establish MUST default a demo-<x> target's app name to demo- and the source app's fleet name when the operator names none and the source is onboarded."
  rationale: "The skills carry the how of a demo phase and read .delivery/demo.json after scope, but the facts only the console holds - which line is the source, and the two fleet names, which differ from the repo names on any install whose organisation prefixes its repositories - have to reach the first worker some way, and the directive is the same shape the Managed home rides in. Without the app-name default a demo of hello-spa would be born as demo-<org>-hello-spa on such an install, a hostname nobody wanted, for the same reason the app name and the repo name were split in the first place (INT-SKELETON-001)."
  test:
    scope: unit
    component: compile_workflow
    type: contract
  criticality: high

INT-FC-R155:
  version: 1.0.0
  status: active
  statement: "EVERY fleet Inbox row derived from a repo carrying the 'foundry-hidden' topic MUST be marked hidden and excluded from the queue by default - every signal, not the 'issue' one alone - and appear only when hidden items are explicitly requested. The rows MUST be MARKED, never dropped from the derivation, so the reveal needs no re-derivation. This carries the Fleet's repo-topic hide (INT-FC-R47) onto the Inbox at repo scope, as INT-FC-R96 carries it at issue scope."
  rationale: "The topic took a repo off the Fleet board and left its whole queue standing: five repos deliberately hidden as noise still filed red-ci rows the operator could not clear or dismiss, and the architecture doc already promised the hide covered the sweep. The label hide could not answer it - it is scoped to one ticket by design (INT-FC-R96) - so the topic needed its own reading at inbox scope. Marking rather than dropping keeps the hide recoverable from Settings, the property INT-FC-R47 was written for: hidden means off the queue, not gone, unlike an archived repo which leaves the sweep entirely."
  test:
    scope: unit
    component: FleetInbox
    type: behavior
  criticality: medium

INT-FC-R156:
  version: 1.0.0
  status: active
  statement: "A gate's sign MUST release only a run parked on the gate it signed - the run's own waiting Suspend node, compiled as `gate-<gate>` and carried on the run row as `parked_gate`, compared with the gate just stamped - and MUST stop every other parked run of that line. A run parked on a gate the line has already passed MUST never be resumed."
  rationale: "The sign resumed the newest suspended run of the delivery whatever gate it waited on, which is only ever right while the console is the single driver. A line driven on at a terminal (sign by hand, run the next phase, push the scratch) leaves the console's run parked on an earlier gate: signing the line's CURRENT gate in the cockpit then released that run, whose next step re-runs a phase the line already holds, with two workers pushing one scratch ref. Leaving it alone instead is no better - a parked run keeps the cockpit's primary disabled on a gate nobody can sign, the state an operator hit on 2026-09-11 - so the mismatch is stopped, and the primary falls back to the next drive. The run knows which gate it waits on and the line knows which gate it signed; the rule is those two names, never a reading of the records a second time."
  test:
    scope: unit
    component: OrchestratorService
    type: behavior
  criticality: high

INT-FC-R157:
  version: 1.0.0
  status: active
  statement: "A line's runs MUST end with the line: closing a line, and establishing a line over a repo that holds none, MUST stop whatever is live for that name and then DELETE every `delivery-<slug>-*` run of it, terminal rows snapshotted first so their evidence survives. No run keyed on a repo's name may outlive the line that made it."
  rationale: "The console matches a line to its runs by the repo's name, so a run that outlives its line is adopted by the next line under that name. On 2026-09-11 a demo line was retired (a demo is retired, never closed, so the close that stops runs never ran), its repo deleted and established again under the same name minutes later; the run still parked on the retired line's design gate was read as the new line's own, and its cockpit sat on a gate that line could never sign, with no act to offer. Stopping is not enough: a stopped run is still adopted, and offers its own Re-drive on a line that never ran. Deleting is safe because the record is git - the records, the gates and the journal are on the scratch ref, and a terminal run's log tail is snapshotted before the row goes."
  test:
    scope: unit
    component: OrchestratorService
    type: invariant
  criticality: high

INT-FC-R158:
  version: 1.0.0
  status: active
  statement: "Every worker-prompt compiler - build_worker_launch (every delivery phase, both modes), the maintenance resolve prompt (every mode, and the revision after a review FAIL), and build_promotion_prompt - MUST carry the landing rule on ONE shared statement of the headless turn: the worker is a single-turn agent that nothing wakes after it stops, so it MUST never start a long-running job in the background and wait for a completion notification. A delivery phase's prompt MUST further direct it to watch CI runs, syncs and Jobs in the foreground with a bounded polling loop, push each coherent unit as it lands it, and stop only with its record at a terminal status - `gate`, or `aborted` through the record helper for a degraded stop - never `in-progress`."
  rationale: "A worker is `claude -p`, which exits when its turn ends. The maintenance and promotion prompts each carried their own copy of this rule and the delivery prompt carried none, and on 2026-09-14 (delivery-moments-dp7qx, build+ship on moments) two pods in a row started a background CI watch or smoke poll, said they would wait for its notification, and ended the turn. The entrypoint read `status: in-progress` in build.md as a crash mid-write and retried each from a fresh clone: two of four attempts burned, and evidence the parked pods gathered never reached the record (a fresh-eyes review round ran with no committed artifact), so the final pod ran it again. The retry itself resumed correctly from the pushed commits, as run-delivery-plan's resume model directs; what parking cost was attempts and unrecorded evidence, not a misreading. The headless half is one constant so the three compilers cannot drift apart; each follows it with what landed means for its own act, because a delivery phase lands on a record status, a resolve on a commit or a PR, and a promotion on its door. Carried as prompt prose at each compiler's choke point for the same reason as INT-FC-R77, R78 and R123: the prompt is the one surface every headless run reads."
  test:
    scope: unit
    component: WorkerLaunch
    type: invariant
  criticality: high

INT-FC-R159:
  version: 1.0.0
  status: active
  statement: "The Settings page MUST offer a Session card, last in its column, whose Sign out control is a plain full-page navigation (an `<a href>`, never a client-side route and never a fetch) to the sign-in proxy's own sign-out route as the door reports it. It MUST be offered ONLY where the OIDC gate fronts the install - the chart's `auth.oidc.enabled`, rendered into the app as FC_OIDC_ENABLED and read back over /api/config/session - and with the gate off, or the door unreachable, the card MUST NOT render."
  rationale: "The console had no sign-out control anywhere. In a browser tab that was survivable, because the operator could type the proxy's route into the address bar; added to a phone's Home Screen there is no address bar, the web app opens full-screen and already logged in (iOS copies Safari's session in at install time), and nothing in the UI could end it - the only ways out were deleting the icon or waiting out the proxy cookie's 7-day default. The route belongs to the oauth2-proxy sidecar, not to the SPA, so the control has to LEAVE the app: a react-router Link would resolve inside the app shell and a fetch would clear the cookie without moving the tab. The gate condition rides on the same chart value that decides whether the sidecar exists at all, so the control and the gate cannot drift apart, and an install serving open offers nothing rather than a control that 404s. This is the proxy-only sign-out: it clears the proxy's cookie and forces a fresh OIDC round trip, and does not end the identity provider's own session, which would need the provider host allowed on the proxy and a post-logout redirect registered on its client."
  test:
    scope: e2e
    component: SettingsPage
    type: behavior
  criticality: medium

INT-FC-R160:
  version: 1.0.0
  status: active
  statement: "The console MUST declare a web app manifest, linked with crossorigin=\"use-credentials\", carrying a frozen id and start_url, display standalone, a short_name, at least one icon whose purpose is absent or includes `any` at both 192 and 512 px, an apple-touch-icon that resolves, and screenshots for both form factors; every icon and screenshot it names MUST be served. It MUST NOT register a service worker."
  rationale: "Installability is two decisions, not one (REF-PWA section 2), and this claim takes the first without the second. Safari 26 removed every installability requirement, so the console already opens standalone from an iOS Home Screen icon carrying no manifest at all - but Chromium still requires one, so without this there is no installed console on Android, only a browser-badged shortcut that reopens it in Chrome; and with no manifest icons and no apple-touch-icon, iOS falls back to a screenshot of the page under a title that truncates. The credentials attribute is load-bearing rather than decorative: a manifest request carries no cookies by default, even same-origin, so behind the oauth2-proxy sidecar that fronts this console the proxy answers it with a login redirect and installability fails with no visible error. Safari reads a manifest icon only where purpose is absent or includes `any`, so a maskable-only set is invisible to it, and a declared apple-touch-icon wins over the manifest outright. The worker is refused deliberately: the console is a live view of a cluster and has nothing worth showing offline, so it would buy a fast launch in exchange for a cached shell that can outrun a deploy, two ways to break the proxy redirect, and a bad worker that persists on a device until a kill switch reaches it. Adding one later is an ordinary change; removing one after clients have installed is not."
  test:
    scope: e2e
    component: manifest
    type: behavior
  criticality: medium

INT-FC-R161:
  version: 1.2.0
  status: active
  statement: "After the agent's turn and before any scratch push, the worker MUST record the run's figures into the phase record as flat frontmatter keys through a deterministic helper (devops/record_run.py), never by a shell edit: `run` (the id the console knows the run by), `run_agent`, `run_model` (the launch model, else the busiest model the harness reports), `run_started` and `run_finished` (ISO-8601 UTC), `run_seconds` (the agent's own run time, launch to result event), `run_tokens` and `run_cost` (USD), the by-type `run_tokens_input` / `run_tokens_output` / `run_tokens_cache_read` / `run_tokens_cache_creation` (summed across every model the result event reports usage for, so the work the agent delegated counts, else read off its top-level usage), `run_turns`, and, when the result event reports usage per model, `run_model_<slug>_tokens` / `run_model_<slug>_cost` with slug the model id lower-cased and every non-alphanumeric as `_` - all read off the final `result` event of the agent's stream-json output. A second run against the same record MUST add tokens, cost, turns and seconds, keep the earliest `run_started` and the latest `run_finished`, name the latest run, and rewrite only these keys, leaving every other byte of the record as it was. A record that does not exist, a record with no frontmatter block, and a stream with no result event MUST each write nothing, say so in one log line, and never fail the run."
  rationale: "The worker already holds the figures: the harness prints them in the stream's final result event, which the entrypoint captured for the session-limit read and then deleted. The phase record is the one durable home every reader of a line already reads, so the ledger foundry-analytics builds (spend per run, and the agent-run half of every phase) derives from git like every other delivery fact, and the keys are the ones that ledger reads. A retry adds rather than replaces because an attempt the executor retried still cost what it cost. The tokens are the per-model sums because the top-level usage covers the agent's own turns alone: a phase that delegated to subagents recorded a sixth of its tokens beside the whole of its cost (#103). The keys describe the run and not the work, so the write sits after the review the agent committed (the reviewed bytes stay the agent's last commit) and can never be the reason a phase fails."
  test:
    scope: unit
    component: worker-entrypoint
    type: behavior
  criticality: medium

INT-FC-R162:
  version: 1.1.0
  status: active
  statement: "The worker MUST authenticate its own checkout through a credential helper scoped to the exact HTTPS repository URL (and, on a demo line, its source repository of the same owner), which reads the token from a 0600 file outside the clone at call time. Its checkout token MUST stay out of clone command arguments, remotes, Git configuration, helper files and checkout diagnostics, including failed clones and failed agent turns. The pair grant MUST remain isolated to its own repository."
  rationale: "A token embedded in a clone URL is persisted as the remote and reaches retained review transcripts when the checkout is inspected. Repository-scoped helpers supply each grant over Git's credential protocol while remotes carry credential-free URLs."
  test:
    scope: integration
    component: worker-entrypoint
    type: behavior
  criticality: high

INT-FC-R163:
  version: 1.0.0
  status: active
  statement: "The domain MUST depend only on domain code and the standard library. Application use cases and ports MUST be independent of transport frameworks and concrete adapters. HTTP routes MUST call inbound contracts. Domain models, exceptions, HTTP models and use cases MUST each have one public class per file."
  rationale: "Dependency boundaries keep business rules independently testable."
  test:
    scope: unit
    component: architecture
    type: invariant
  criticality: high

INT-FC-R164:
  version: 1.0.0
  status: active
  statement: "Metadata queries MUST read published observations without calling GitHub, including before the first observation. A failed observation MUST preserve the last successful data and expose its freshness."
  rationale: "Polling must have bounded source cost and distinguish unavailable data from empty results."
  test:
    scope: unit
    component: observations
    type: behavior
  criticality: high

INT-FC-R165:
  version: 1.0.0
  status: active
  statement: "Commands MUST require an immutable trusted principal with explicit action and repository scope. Scheduler authority MUST resolve a server-stored grant and enforce its expiry and current authorization revision. Request headers and workflow annotations MUST NOT independently confer authority."
  rationale: "Every mutation requires a verifiable authority at its execution boundary."
  test:
    scope: unit
    component: command-authority
    type: invariant
  criticality: high

INT-FC-R166:
  version: 1.0.0
  status: active
  statement: "Mutations MUST durably claim an operation key and record dispatch intent before the effect. Concurrent retries and restart after an uncertain outcome MUST NOT repeat that effect. Completed receipts MUST be scoped to the authorized owner; secret writes MUST retain neither secret values nor their digests."
  rationale: "Lost responses must not duplicate externally visible effects or expose credentials."
  test:
    scope: unit
    component: operation-receipts
    type: behavior
  criticality: high

INT-FC-R167:
  version: 1.0.0
  status: active
  statement: "Delivery resolution and workflow compilation MUST consume the same validated lifecycle definition pinned to the line, with its content revision and digest. Supported phase additions and removals MUST affect both without changing orchestration code. Unsupported handlers and unresolved dependencies MUST be refused."
  rationale: "An evolving process needs explicit immutable execution inputs."
  test:
    scope: unit
    component: lifecycle
    type: contract
  criticality: high

INT-FC-R168:
  version: 1.0.0
  status: active
  statement: "Every HTTP route MUST publish typed response and error contracts through an offline-exportable OpenAPI schema. The backend MUST serve API traffic separately from the static web application."
  rationale: "Generated clients and separately served assets require a complete source-independent API contract."
  test:
    scope: unit
    component: http
    type: contract
  criticality: high

INT-FC-R169:
  version: 1.1.0
  status: active
  statement: "Background observation MUST collect each repository's metadata before its observation leaves the declared freshness window, oldest attempt first, a few repositories at a time and at most one bounded batch per scheduler tick, so a healthy fleet of 75 repositories stays fully fresh at the scheduler's cadence when each repository is collected on its first due tick. A repository MUST NOT be collected again before it is due, except by an explicit refresh. Failed and expired observations MUST remain stale or unavailable."
  rationale: "Complete coverage must be reachable under healthy sources at the request rate the freshness window needs, without spending quota on reads that are not yet due."
  test:
    scope: unit
    component: observations
    type: behavior
  criticality: high

INT-FC-R170:
  version: 1.0.0
  status: active
  statement: "The composition root MUST construct every capability with its final dependencies and MUST refuse to assemble when a published capability does not satisfy its port. Commands MUST read the line's current delivery configuration; metadata queries read published observations."
  rationale: "A dependency rebound after construction can leave a command acting on observed rather than current evidence without any failing request."
  test:
    scope: unit
    component: composition-root
    type: invariant
  criticality: high

INT-FC-R171:
  version: 1.0.0
  status: active
  statement: "A repository's target settings (its model selection and worker credential) MUST belong to one repository incarnation. An operator's settings write MUST bind the repository as it exists, first clearing settings retained under its name for another incarnation, and MUST change nothing when the repository cannot be observed. A drive MUST refuse target settings that are not bound to the current incarnation."
  rationale: "A repository recreated under a former name must not inherit its predecessor's agent or credential, while a maintained repository configured by the operator remains drivable without a delivery line."
  test:
    scope: unit
    component: repository-identity
    type: invariant
  criticality: high

INT-FC-R172:
  version: 2.0.0
  status: active
  statement: "A line's next phase MUST launch on the installed versioned or digest-pinned worker image when the installation executes the line's pinned playbook revision, and MUST be refused before credentials or submission otherwise. A line carrying no lifecycle pin MUST be observed with the installed definition, without failing the observation of other lines, and on its next drive MUST adopt the installed definition, recording that pin beside the line's configuration before the run is submitted. A refusal under this rule MUST name its reason rather than read as an unavailable source."
  rationale: "Console releases change the worker image while in-flight lines continue, and lines opened by hand from the playbook carry no console pin. A line an earlier console opened after the upgrade had pinned the installation's lines (playbook#477, SolveOS) could not be driven at all, since only establishing pins and the line was already established, and the cockpit read the refusal as an unavailable source with an unknown outcome."
  test:
    scope: unit
    component: lifecycle
    type: behavior
  criticality: high

INT-FC-R173:
  version: 1.0.0
  status: active
  statement: "The console MUST admit one configured machine caller through an execution door: an in-cluster Service the Gateway never routes, whose requests carry the web tier's door marker and proxy secret and the caller's bearer, checked against the installation's execution token. The door MUST serve only establishing a line, listing agents, applying an agent to a line, reading and setting its mode and phase timeout, driving it, reading its state and run status, and closing it; the caller MUST hold only those actions, on the repositories the installation names for it under its own owner, and every command and every read of a line MUST name one of them. A machine drive MUST name no worker settings, so a line runs on the agent applied to it and the console's stored credential reaches only that agent's endpoint; a machine establish MUST carry the ask alone. A request through the door with any other path, a missing or wrong token, a scope outside the installation's owner, or an unconfigured door MUST be refused, and an operator identity MUST NOT be admitted through it."
  rationale: "The benchmark opens, runs and closes bench deliveries with nobody in the loop, and the console's other doors admit only a person signed in through the browser. A machine caller needs its own credential and the narrowest lever that does the job, never the operator's: a drive that could name its own endpoint would hand any saved agent's key to whoever holds the door token, and a scope under another owner would resolve by name onto the installation's own lines."
  test:
    scope: unit
    component: command-authority
    type: invariant
  criticality: high

INT-FC-R174:
  version: 1.0.0
  status: active
  statement: "The GitHub transport MUST report to the served process's log, at most once per interval, the requests it sent upstream (and the scheduler's share of them), the answers it served from immutable cache without a request, the conditional answers that came back not modified, its refusals, and the lowest remaining primary budget across its credentials, naming no credential and no URL."
  rationale: "The request budget is the reason observations are scheduled, and an upstream request, a reused immutable answer and a 304 cost GitHub's quota differently; a report that keeps them apart, over a stated interval, is how the install's request volume and headroom are recorded rather than estimated."
  test:
    scope: unit
    component: github-transport
    type: behavior
  criticality: medium

INT-FC-R175:
  version: 1.0.0
  status: active
  statement: "A line command's scan of the executor's inventory (superseding older runs on a drive, releasing a parked run on a sign, ending runs on a close or an establish) MUST pass over an execution in a terminal phase whose kind it cannot read, so a finished execution the console cannot classify never refuses the command; a live execution whose kind cannot be read MUST still refuse it, and a finished execution it can classify MUST still be selected, so a close ends it with the line."
  rationale: "The classifier that keys a delivery execution on its captured scratch-ref annotation (6.18.0) met the 34 finished workflows an earlier console had created without one, and every drive, establish, close and sign on chaos failed for every repository with 'The workflow execution kind is unavailable or invalid', for as long as a failed workflow is retained (30 days). A finished execution the console cannot place decides nothing for the line (a close could not attribute it either; retention ages it out), so it is passed over; the fail-closed read stays for a live one, which the scan would otherwise stop or resume."
  test:
    scope: unit
    component: line-runs
    type: behavior
  criticality: high

INT-FC-R176:
  version: 1.0.0
  status: active
  statement: "A delivery or maintenance drive's repository write right MUST be the console's own fact, set by the drive once the caller is admitted; the request body MUST NOT be required to assert it, and the cockpit's body, which carries no credential and no right, MUST drive."
  rationale: "The trusted web tier (6.18.0) stopped the browser from asserting repo_rights on its drive requests, and nothing on the server supplied it, so every Drive and Maintenance Drive from the console was refused with 'config incomplete: a repo target and its rights are required' (chaos, 2026-10-07), while every test built its RunConfig with the right already set and the one browser test of the route stubbed the server. The promotion drive already sets the right itself; the delivery and maintenance drives do the same, and a test posts the browser's exact body to the real route."
  test:
    scope: integration
    component: drive
    type: behavior
  criticality: high

INT-FC-R177:
  version: 1.0.0
  status: active
  statement: "The console's call to the platform studio's repository scaffold MUST wait longer than its studio reads: long enough for the scaffold the studio performs in the request, and less than the execution door's proxy waits for the whole establish, so an establish never gives up on a repository the studio is still writing."
  rationale: "The scaffold refreshes the studio's platform checkout, creates the repository, seeds main and opens the deploy branch, about ten seconds of GitHub calls. Under the one 8-second studio timeout an establish through the execution door answered operation_unknown half a second before the studio finished, leaving the repository scaffolded with no line registered (#175). Reads keep the short timeout, because a slow read degrades a view rather than stranding a write."
  test:
    scope: unit
    component: studio-gateway
    type: behavior
  criticality: high

INT-FC-R178:
  version: 1.0.0
  status: active
  statement: "Once a line's mode change succeeds, the next read of that line's configuration MUST answer the new mode, and the command's own answer MUST carry the mode it committed."
  rationale: "Reads of a line's configuration serve the observed metadata projection, which collection brings up to date only when the repository is next due: at the next tick for a new line, up to the fifteen-minute freshness window for one observed recently. A caller that checked its own write read the previous mode (and 'interactive' on a new line) and parked the line (#177). The command publishes the mode it committed to the projection and answers with it, rather than with the mode a read of the branch it has just moved returns; collection keeps its cadence."
  test:
    scope: unit
    component: delivery-config
    type: behavior
  criticality: high

INT-FC-R179:
  version: 1.0.0
  status: active
  statement: "A close MUST create the delivered tag's ref, pointing at its annotated tag object, through a write GitHub accepts for a tag object, and only then delete the line's branch with a compare-delete at the approved tip; the atomic ref update MUST carry commit ids only. A tag ref another close created meanwhile MUST be accepted only when it anchors the same tip, and a branch that moved MUST keep its branch, with the tag anchoring the tip that was approved."
  rationale: "GitHub's updateRefs takes commit ids only and answers 'Invalid object type tag, expected commit' to a ref at an annotated tag object, so a close that created the tag and deleted the branch in one updateRefs never landed: every close answered operation_unknown and no line ever closed (#183). The REST refs API takes the tag object and refuses a ref that already exists; updateRefs keeps the branch delete conditional on the approved tip, and tag-then-delete (INT-FC-R79) keeps the line's history anchored before its branch goes."
  test:
    scope: unit
    component: close-line
    type: behavior
  criticality: high

INT-FC-R180:
  version: 1.0.0
  status: active
  statement: "Wherever a command selects executions by repository (a drive's supersede, a sign's release of the parked run, a close's or an establish's end of the line's runs, the maintenance reconcile and its delegated runs), the repository identities MUST be compared case-insensitively, as GitHub resolves them."
  rationale: "A command's context lowercases the repository identity, while an execution's annotation keeps the case the repository was created with. In a mixed-case organisation the exact comparison matched nothing: a drive never stopped the line's older run, a sign never released the run parked on its gate (the operator had to Resume it by hand), and a close left the line's runs behind. GitHub treats the two forms as one repository, so comparing them case-insensitively selects exactly the line's executions and no other repository's."
  test:
    scope: unit
    component: line-runs
    type: behavior
  criticality: high
INT-FC-R181:
  version: 2.0.0
  status: active
  statement: "A one-shot gate whose stamp refuses (the stamper prints a REFUSED or FAIL line) over a passing committed fresh-eyes review MUST record that review with signed left pending, MUST write the stamper's refusal line on the record as stamp_refused, which the line's next command names, MUST push that record, and MUST then end the step on the stamp-refused terminal exit (68), which the retry expression excludes, so the line reads awaiting that gate and signable from the cockpit. A stamper exit with no refusal line MUST stay a transient failure, and a refusal that also refuses recording the review MUST fail the attempt naming both."
  rationale: "A refused stamp is a closure no blind retry clears. Some refusals are walls outside the record: a studio that is down, an export it would not serve, a door that 404s. Others name what the record or the studio content the phase wrote lacks: a proposal with no delivers:, a design record with no Prototype: pointer, an estimation project with no activity files. The worker cannot tell the two apart from the stamper's line, and a retry is handed none of it as critique, so it re-runs the whole phase into the same refusal; that ended a run Failed with the line stranded and nothing said (SolveOS, 2026-10-07, playbook#477; #181). Every refusal therefore stops the way the other terminal exits do (R113, R117): the passing review stays recorded, and the stamper's line, named where the operator signs, says what the closure or the record lacks. The next act is the operator's: Sign, which exports through the record's link, closes a gate whose wall has cleared before a drive continues the line in one-shot, and a refusal the record caused is answered by a re-drive with that line as its feedback (R70). The run suspends for none of it: REF-Delivery section 1 compiles one-shot gates to no suspend steps, and REF-Autonomy section 3 grants human gates before the run, never inside it."
  test:
    scope: integration
    component: DeliveryGateExecution
    type: behavior
  criticality: critical
INT-FC-R182:
  version: 1.0.0
  status: active
  statement: "Every worker step MUST record its last refusal line as an output that outlives the pod, and the cockpit MUST show a failed delivery run as failed with that line beside it (else the failed step's executor message), never as a phase in progress."
  rationale: "A failed run reported only an exit code, and its pods are reclaimed after the retention delay, so the reason a line stopped was gone by the time the operator opened it. The step's own words, kept on the Workflow object, say why where the operator looks."
  test:
    scope: unit
    component: RunRefusal
    type: behavior
  criticality: high

INT-FC-R190:
  version: 1.0.0
  status: active
  statement: "A command whose dispatch fails MUST log what failed and what it was raised from, keep it on the operation's receipt and return it in the unknown-outcome answer, as the failure's class and message; a source-unavailable answer MUST name the source's own message. Each MUST have token-shaped strings, URL credentials and query strings removed and its length bounded, and a cause raised `from None` MUST stay hidden. The cockpit's unknown-outcome message MUST name the operation key the answer carried, which the operations endpoint inspects, and the request's own id only when the answer carried none."
  rationale: "Every dispatch failure answered one fixed 'operation outcome is unknown' and every source failure one fixed 'the source is unavailable', with the cause logged nowhere and the receipt reading only dispatch_outcome_unconfirmed; the cockpit named the request's own id, which the operations endpoint cannot look up. Each of a benchmark's four failures that day took a read of the pod and the studio's logs to find (#158). The console's messages name what failed, and the scrub keeps a wrapped library message from carrying a secret into the log, the receipt or the answer."
  test:
    scope: unit
    component: admission
    type: behavior
  criticality: high

INT-FC-R191:
  version: 1.0.0
  status: active
  statement: "After a drive, the cockpit MUST re-read the runs, the line and the newest run's graph on the same short cadence a sign uses, so a run the executor lists only seconds after the drive answers shows its run strip (name, phase, elapsed, logs, Stop and Terminate) without a reload."
  rationale: "The cockpit read the runs once, straight after the drive answered, before the executor listed the new workflow, and its live poll runs only once a run is known, so on a line with no known run the strip never appeared until a reload (#179). A sign already followed the run it releases up on a short cadence; a drive starts one, so it follows it the same way."
  test:
    scope: e2e
    component: cockpit
    type: behavior
  criticality: medium

INT-FC-R192:
  version: 1.0.0
  status: active
  statement: "The worker MUST start the agent with no secret in its environment: neither the phase's git token (FC_GIT_TOKEN, GH_TOKEN, GITHUB_TOKEN), the pair's grant (FC_PAIR_TOKEN), the raw model credential (FC_MODEL_CREDENTIAL), a gateway key (ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN) nor a studio's MCP password (FC_MCP_<DOOR>_PASS, which the CLI reads from its MCP config's headers). The agent's own git and gh MUST still act as the phase's identity, reading the token from a 0600 file at call time, and a gateway key MUST reach the CLI through apiKeyHelper reading its own 0600 file; the subscription token stays the CLI's, which keeps it from the commands it runs."
  rationale: "A design agent's `env | grep ^FC_` printed the git token and the model credential into its transcript three days after the corpus rule against listing the environment landed (#180, playbook#439 and #477): a rule the agent reads cannot hold a secret the agent's environment holds. Measured on CLI 2.1.293 against a stand-in API with canary credentials, the agent's Bash commands saw ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, FC_GIT_TOKEN and GH_TOKEN, and not CLAUDE_CODE_OAUTH_TOKEN; CLAUDE_CODE_SUBPROCESS_ENV_SCRUB requires bubblewrap and stopped the CLI before its first request in the worker's container, so the secrets are kept out of the agent's environment instead, and an apiKeyHelper key arrives as both headers a gateway may read."
  test:
    scope: unit
    component: worker-entrypoint
    type: behavior
  criticality: critical

INT-FC-R193:
  version: 1.0.0
  status: active
  statement: "The worker's log MUST name, at session start, the agent CLI's version, model, effective permission mode and MCP servers, with a warning when the mode is not bypassPermissions; it MUST print one line per failed tool call naming the tool, and one per permission the harness denied; and every line MUST be masked of the credential values the pod holds. The phase record MUST carry the run's denial count as run_permission_denials, added across attempts like the other run figures."
  rationale: "A build+ship run stopped degraded three times on a refused git push, and neither the pod log nor the console's snapshot could confirm the refusal or show what else was refused: the narration dropped every tool result, the init event that names the effective permission mode, and the result's permission_denials, so the cause had to be reconstructed by re-running the worker image (#169). The shapes are the CLI's own (measured on 2.1.293); a failed call can carry a command's output, so the mask covers every printed line."
  test:
    scope: unit
    component: worker-entrypoint
    type: behavior
  criticality: high

INT-FC-R183:
  version: 1.0.0
  status: active
  statement: "With the sign-in proxy on and an admin group configured, admission MUST resolve each operator's admin standing and teams from the groups the sign-in proxy forwards, a group named with or without its leading path slash. A member of the admin group MUST hold every action on the installation's repository scope; any other operator MUST hold every action but the team settings and the installation-wide settings (the home co-pilot, git identities and their roles, pair credentials, the named settings), on exactly the repositories assigned to the teams whose group they belong to. With no admin group configured, every operator MUST be an admin. The teams and their project assignments MUST live in the console's settings, set by admins and read by admins alone; a team member's establish records its own line's assignment (INT-FC-R185). The admin group MUST be part of the admission policy's revision."
  rationale: "One install serves several teams, and team membership already lives in the identity provider as groups, so the console keeps no user store of its own. Admission is where the command context gets its scope, so resolving teams there scopes every command the console already admits. An installation-wide setting serves every team at once (the home co-pilot reads every team's floor; a git identity or a pair credential signs every team's acts), so a member who could write one would reach every other team's work. An install that names no admin group keeps today's behaviour, and the operators added to the admin group on the day teams switch on lose nothing."
  test:
    scope: unit
    component: command-authority
    type: invariant
  criticality: high

INT-FC-R184:
  version: 1.0.0
  status: active
  statement: "A team member MUST see its teams' projects alone: the fleet (and the fleet rescan's answer), the fleet inbox, the deliveries list, the run inventory and the home co-pilot's grounding MUST leave out every other repository, and a read naming a repository (a line's state, overview, configuration, tree, file and substance, a repository's maintenance and promotion reads, a project co-pilot turn, a plan) or a run (its graph, logs and status) outside its scope MUST be refused. A project assigned to no team, and a run naming no repository, MUST be visible to admins alone; an admin MUST see every project."
  rationale: "The fleet, the inbox, the deliveries, the runs and the logs are served from one installation-wide snapshot, observed once for everyone. Filtering each read by the caller's scope at the door keeps the observation shared and the view per team, and a chat grounded in the same filtered floor never tells one team about another's work."
  test:
    scope: unit
    component: team-scope
    type: invariant
  criticality: high

INT-FC-R185:
  version: 1.0.0
  status: active
  statement: "An establish MUST record the line's team in the same command, before the scratch that makes the repository a line. A team member's line MUST belong to the team it names, the repository's own team, or its only team, and a member of several teams naming none MUST be refused and asked to choose. A member MUST be refused a repository assigned to another team and an existing repository assigned to none; an admin MAY name any team or none, and the execution door names none."
  rationale: "A delivery a team member starts belongs to its team from its first moment, or the member would open a line it cannot see. Recording the assignment inside the admitted establish makes it as durable as the line. Letting a member claim an existing unassigned repository would hand any member any repository of the organisation, so an existing repository joins a team by an admin's assignment."
  test:
    scope: unit
    component: establish
    type: behavior
  criticality: high

INT-FC-R186:
  version: 1.0.0
  status: active
  statement: "A saved agent MUST carry an owner level: install (applied by everyone, added by admins alone), team (applied by that team's members, added by any of them) or user (applied by its owner alone, added by anyone for themselves). The agent list MUST offer a caller the install's agents, its teams' and its own, marked with what it may apply and edit, and an admin MUST see every agent. Applying an agent the caller may not use, writing over an agent another owner holds, or deleting one MUST be refused with the reason. An agent saved before levels existed MUST read as an install agent, and the home co-pilot MUST take an install agent alone, applied by an admin."
  rationale: "A seat can be private to one person or shared by a team, and an API key can serve everyone. Keeping the level on the saved agent, rather than in a store of its own, leaves the apply-to-line act unchanged; the home co-pilot answers every operator, so a personal or team seat applied to it would serve people it does not belong to."
  test:
    scope: unit
    component: saved-agents
    type: behavior
  criticality: high

INT-FC-R187:
  version: 1.0.0
  status: active
  statement: "Applying an agent MUST record its level and owner beside the line's model selection, and the owner MUST follow the seated key: a write that keeps the key (a model, endpoint or timeout change) MUST keep it, only the seat's owner MAY point the key at another endpoint or model, and seating another key replaces it. A delivery, maintenance or promotion drive, a one-shot re-drive and a project co-pilot turn on a line whose applied agent is another person's personal seat MUST be refused, naming the seat's owner and the remedy of applying a team or install agent. A line set to a direct endpoint, or applied before levels existed, MUST drive as before."
  rationale: "Applying an agent copies its credential to the line, so the line runs on the seat whoever presses Drive. A seat private to its owner stays private only if the drive checks who is pressing; the owner recorded at apply time is what the copy belongs to, even after the agent is edited or deleted."
  test:
    scope: unit
    component: saved-agents
    type: invariant
  criticality: high

INT-FC-R188:
  version: 1.0.0
  status: active
  statement: "The execution door MUST list and apply install agents alone, and a machine drive on a line whose applied agent is not an install agent MUST be refused with the reason."
  rationale: "The benchmark runs on agents an admin chose for the whole install. A seat that should serve it is added as an install agent; per-agent grants to the door would be a second permission system beside the levels."
  test:
    scope: unit
    component: command-authority
    type: invariant
  criticality: high

INT-FC-R189:
  version: 1.0.0
  status: active
  statement: "The named-setting door MUST read and write only the run retention and the MCP doors' credentials. An agent, a target selection, a team, a project assignment, a git identity and a pair credential MUST be read and written through their own doors alone."
  rationale: "The named-setting door writes any setting by name. Left open, it would write an agent's owner or a team's assignments past every rule their own doors enforce."
  test:
    scope: unit
    component: settings
    type: invariant
  criticality: high

INT-FC-R194:
  version: 1.0.0
  status: active
  statement: "A retained run record MUST stay readable across an additive change to its format: a field the record predates MUST read as that field's default, while an unknown key or a missing field without a default is still malformed. A record that cannot be read MUST withhold only itself: the archive read MUST still report the archive unavailable, and the observation tick MUST merge every record it did read."
  rationale: "Twelve records written before #181 added the node's refusal field failed the codec's exact-key check, and one unreadable record refused the whole read: every tick on chaos merged no archived run and marked the board unavailable, so each run vanished from the console once its Workflow was deleted (#201). A field added with a default is the ordinary way the format grows; a record the console cannot read is still reported, never taken for an empty archive."
  test:
    scope: unit
    component: observations
    type: behavior
  criticality: medium

INT-FC-R195:
  version: 1.0.0
  status: active
  statement: "The worker MUST launch the agent with a permission-prompt tool, served from the worker image through the agent's MCP config, that allows every ask with the ask's own input. After the turn, the log MUST print one line per answered ask naming the tool and what it acts on, masked of the credential values the pod holds."
  rationale: "Some model keys carry an organisation policy that turns bypass mode off; a headless session then refuses every ask with nobody to answer it (#169). The policy overrides --allowedTools, an allow hook and the CLI's auto mode, while the prompt tool receives every ask and its answer is honoured (playbook#482, measured on 2.1.282 and 2.1.293). The policy's deny rules refuse before an ask exists, so they stand (#212)."
  test:
    scope: unit
    component: worker-entrypoint
    type: behavior
  criticality: high
