apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "foundry-console.labels" . | nindent 4 }}
data:
  FC_WORKER_IMAGE: {{ printf "ghcr.io/%s/%s:%s" .Values.githubOwner .Values.images.worker.name (default .Chart.AppVersion .Values.images.worker.tag) | quote }}
  {{- range $k, $v := .Values.config }}
  {{- if ne $k "FC_WORKER_IMAGE" }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
