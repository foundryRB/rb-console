apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "foundry-console.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "foundry-console.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: {{ if .Values.auth.oidc.enabled }}oidc{{ else }}web{{ end }}
